  // Plain-text body for the python fill_pm15.py route or manual paste.
  function downloadPM15Body() {
    const lines = ["PROJECT CHARTER — S/4HANA PUBLIC CLOUD", "(content for PM_15 'Paste content from J4C here')", ""];
    state.forEach((e) => {
      lines.push(`${e.id}. ${e.name.toUpperCase()}`);
      const bl = e.bullets || [];
      const tbls = e.tables || [];
      if (bl.length) bl.forEach((b) => lines.push(`  • ${b.text} [${b.source || "?"}]`));
      tbls.forEach((t) => {
        lines.push(`  [Table] ${t.title} [${t.source || "?"}]`);
        lines.push("    " + (t.columns || []).join(" | "));
        (t.rows || []).forEach((r) => lines.push("    " + (r || []).join(" | ")));
      });
      if (!bl.length && !tbls.length) lines.push("  [not drafted]");
      if (e.checklist && e.checklist.length) {
        lines.push("  Output-Spec checklist:");
        e.checklist.forEach((c) => {
          const mk = c.verdict === "covered" ? "[x]" : c.verdict === "partial" ? "[~]" : "[ ]";
          lines.push(`    ${mk} ${c.item}${c.note && c.verdict !== "covered" ? ` — ${c.note}` : ""}`);
        });
      }
      lines.push("");
    });
    triggerDownload(new Blob([lines.join("\n")], { type: "text/plain" }), `Charter_J4C_body_${new Date().toISOString().slice(0,10)}.txt`);
  }

  // ── CHARTER ANNEX (v3.2) — the no-page-limit companion document ──
  // Renders from the same fact registry + full uncapped captures, so it is
  // consistent with the charter by construction. Holds: SOW Coverage Report,
  // the fact registry, full per-wave gate tables, every captured item (with
  // "not shown in charter — rank #N"),
  function downloadAnnex() {
    const today = new Date().toISOString().slice(0, 10);
    const reg = registryRef.current || {};
    const cell = "padding:5px 9px;border:1px solid #C9C9C9;font-size:11px;vertical-align:top;";
    const hdr = "background:#460073;color:#fff;font-weight:bold;padding:6px 10px;border:1px solid #46407a;font-size:12px;";
    const subHdr = "background:#EEE9F5;color:#460073;font-weight:bold;padding:4px 8px;border:1px solid #C9C9C9;font-size:11px;";
    const secTitle = (n, t) => `<div style="margin:22px 0 6px;font-size:16px;font-weight:bold;color:#460073;">§${n} &nbsp;${esc(t)}</div><div style="border-top:2px solid #F2B705;width:60px;margin-bottom:10px;"></div>`;
    const src = (s) => s ? ` <span style="font-size:9px;color:#0A3D7A;background:#E8F1FC;padding:1px 5px;border-radius:3px;">${esc(s)}</span>` : "";

    const clientName = (projectMeta.client || "").trim();
    const projectName = (projectMeta.project || "").trim();

    // §1 SOW Coverage Report
    const cov = Array.isArray(coverage) ? coverage : [];
    const covRows = cov.length
      ? cov.map((s) => `<tr><td style="${cell}">${esc(s.section)}</td><td style="${cell}text-align:center;color:${s.present ? "#1E7A34" : "#B42318"};font-weight:bold;">${s.present ? "✓ present" : "✗ absent"}</td></tr>`).join("")
      : `<tr><td style="${cell}" colspan="2">No coverage report captured this run.</td></tr>`;
    const covSection = secTitle(1, "SOW Coverage Report") +
      `<div style="font-size:10.5px;color:#555;margin-bottom:6px;">Which standard SOW sections were found. A "✗ absent" verifies the SOW has no such section — so a related "not covered in SOW" flag is a genuine gap, not an extraction miss.</div>` +
      `<table style="width:100%;border-collapse:collapse;"><tr><td style="${subHdr}">Standard section</td><td style="${subHdr}text-align:center;">Status</td></tr>${covRows}</table>`;

    // §2 Fact Registry (single source of truth)
    const waves = Array.isArray(reg.waves) ? reg.waves : [];
    const ms = Array.isArray(reg.milestones) ? reg.milestones : [];
    const ents = Array.isArray(reg.entities) ? reg.entities : [];
    const figs = Array.isArray(reg.figures) ? reg.figures : [];
    const msRows = ms.length ? ms.map((m) => `<tr><td style="${cell}">${esc(m.item || "")}</td><td style="${cell}">${esc(m.wave || "")}</td><td style="${cell}">${esc(m.gate || "")}</td><td style="${cell}">${esc(m.date || "date per project plan")}</td><td style="${cell}">${esc(m.source || "")}</td></tr>`).join("") : `<tr><td style="${cell}" colspan="5">No structured milestones captured.</td></tr>`;
    const regSection = secTitle(2, "Fact Registry — single source of truth") +
      `<div style="font-size:10.5px;color:#555;margin-bottom:6px;">Every charter and annex table renders from this registry, so a date appears identically everywhere. Financial values are excluded by design.</div>` +
      `<div style="${subHdr}">Milestones (${ms.length})</div>` +
      `<table style="width:100%;border-collapse:collapse;margin-bottom:8px;"><tr><td style="${subHdr}">Item</td><td style="${subHdr}">Wave</td><td style="${subHdr}">Gate</td><td style="${subHdr}">Date</td><td style="${subHdr}">Source</td></tr>${msRows}</table>` +
      (ents.length ? `<div style="${subHdr}">Entities / IDs (${ents.length})</div><div style="${cell}">${ents.map((e) => esc(e.name)).filter(Boolean).join(" · ")}</div>` : "") +
      (figs.length ? `<div style="${subHdr}">Figures read (${figs.length})</div>` + figs.map((f) => `<div style="${cell}">${esc(f.ref || "figure")} — ${f.readable === false ? "<b style='color:#B42318;'>NOT machine-readable — manual review</b>" : "read"}${f.note ? " · " + esc(f.note) : ""}</div>`).join("") : "");

    // §3 & §4 (removed v3.8) — the full per-group gate tables and the uncapped
    // per-component captures duplicated the charter, which is now fully content-scaled
    // (nothing is capped or displaced). The charter itself is authoritative; the annex
    // no longer shadows it.

    // §5 (removed v3.8) — the "standard S/4HANA reference checklist" was NON-SOW content
    // and violates the SOW-only principle. Nothing outside the SOW appears anywhere.

    // §6 Consistency
    const conf = Array.isArray(consistency) ? consistency : [];
    const consSection = secTitle(3, "Cross-table consistency") +
      (conf.length ? `<div style="font-size:11px;color:#B42318;">Conflicts flagged (same item, different dates) — review against SOW:</div><ul style="margin:3px 0;padding-left:18px;">${conf.map((c) => `<li style="font-size:11px;">${esc(c)}</li>`).join("")}</ul>` : `<div style="font-size:11px;color:#1E7A34;">No cross-table date conflicts detected. All shared facts render identically from the registry.</div>`);

    const cover = `<div style="border-left:8px solid #460073;padding:34px 28px;background:#F6F4FA;">
      <div style="font-size:34px;font-weight:bold;color:#2B0A3D;">CHARTER ANNEX</div>

    </div>`;

    // §7 Fill Checklist (v3.3) — scrubbed / not-found identity fields to complete
    const fills = Array.isArray(reg.fills) ? reg.fills : [];
    const compText = (e) => {
      const fb = e.fullBullets || e.bullets || [];
      const ft = e.fullTables || e.tables || [];

    };
    const appearsIn = (token) => state.filter((e) => token && compText(e).includes(token)).map((e) => `${e.id} ${e.name}`);
    const scrubbedFills = fills.filter((f) => f && /scrub/i.test(f.verdict || ""));
    const notFoundFills = fills.filter((f) => f && /not\s*found/i.test(f.verdict || ""));
    const fillRows = scrubbedFills.length
      ? scrubbedFills.map((f, i) => {
          const tok = f.token || `[FILL: ${f.label}]`;
          const where = appearsIn(tok);
          return `<tr><td style="${cell}">${i + 1}</td><td style="${cell}font-family:monospace;">${esc(tok)}</td><td style="${cell}">${where.length ? esc(where.join("; ")) : "—"}</td><td style="${cell}text-align:center;">☐</td></tr>`;
        }).join("")
      : `<tr><td style="${cell}" colspan="4">No scrubbed identity fields detected.</td></tr>`;
    const notFoundList = notFoundFills.length
      ? `<div style="${subHdr}">NOT FOUND — verify against the original SOW</div>` + `<div style="${cell}">${notFoundFills.map((f) => esc(f.label)).join(" · ")} <span style="color:#B4690E;">(scrubbed OR genuinely absent — the agent cannot tell; confirm against the unredacted contract)</span></div>`
      : "";
    const fillSection = secTitle(4, "Fill Checklist — complete before signature") +
      `<div style="font-size:10.5px;color:#555;margin-bottom:6px;">Each token below is one scrubbed/redacted value. It appears identically everywhere listed, so a single find-and-replace per token completes the charter. Financial values are never tokenised — they are excluded entirely.</div>` +
      `<table style="width:100%;border-collapse:collapse;"><tr><td style="${subHdr}">#</td><td style="${subHdr}">Placeholder token</td><td style="${subHdr}">Appears in</td><td style="${subHdr}text-align:center;">Filled?</td></tr>${fillRows}</table>` +
      notFoundList;

    // §8 PM Review Notes + §9 Pre-Ship Rubric (PM_Skill.md — advisory, annex only)
    const rev = pmReview || {};
    const notes = Array.isArray(rev.notes) ? rev.notes : [];
    const noteRows = notes.length
      ? notes.map((n) => `<div style="${cell}"><b style="color:#B4690E;">FLAG [${esc(n.category || "")}]</b>: ${esc(n.flag || "")} <span style="font-size:9px;color:#0A3D7A;background:#E8F1FC;padding:1px 5px;border-radius:3px;">${esc(n.ref || "SOW")}</span><br><span style="color:#555;font-size:10px;">${esc(n.why || "")}</span></div>`).join("")
      : `<div style="${cell}">No red-flag observations raised for the captured facts.</div>`;
    const notesSection = secTitle(5, "PM Review Notes — observations, NOT charter content") +
      `<div style="font-size:10.5px;color:#B42318;margin-bottom:6px;font-weight:bold;">Advisory only. These are a senior PM's observations over the SOW facts — they are NOT part of the charter and were never inserted into it. Each cites its source clause.</div>` + noteRows;
    const rubric = Array.isArray(rev.rubric) ? rev.rubric : [];
    const rubTotal = rubric.reduce((a, r) => a + (Number(r.score) || 0), 0);
    const rubRows = rubric.length
      ? rubric.map((r) => {
          const label = PM_RUBRIC[(r.n || 0) - 1] || `Check ${r.n}`;
          const col = r.score === 2 ? "#1E7A34" : r.score === 1 ? "#B4690E" : "#B42318";

        }).join("")
      : `<tr><td style="${cell}" colspan="3">Rubric not scored this run.</td></tr>`;
    const rubricSection = secTitle(6, `Pre-Ship Quality Rubric — ${rubTotal}/18`) +
      `<table style="width:100%;border-collapse:collapse;"><tr><td style="${subHdr}">Check</td><td style="${subHdr}text-align:center;">Score</td><td style="${subHdr}">Note</td></tr>${rubRows}</table>`;

    const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'>
      <style>@page{size:8.5in 11in;margin:1in;} body{font-family:Calibri,Arial,sans-serif;color:#1A1A2E;} table{border-collapse:collapse;width:100%;}</style></head>
      <body>${cover}<div style="page-break-before:always;"></div>${covSection}${regSection}${consSection}${fillSection}<div style="page-break-before:always;"></div>${notesSection}${rubricSection}</body></html>`;
    triggerDownload(new Blob(["\ufeff" + html], { type: "application/msword" }), `Charter_Annex_${today}.doc`);
  }

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 1.2, color: NAVY }}>INPUTS</div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={resetAll} style={ghost}>Reset</button>
              </div>
            </div>

            <div style={{ position: "relative", paddingLeft: (!running && !done) ? 40 : 0 }}>
              {!running && !done && (
                <div style={{ position: "absolute", left: 0, top: chefTop, width: 34, height: 34, pointerEvents: "none", textAlign: "center", transition: "top 0.95s cubic-bezier(.45,.05,.35,1)", zIndex: 2 }} aria-hidden="true" title="Prepping your ingredients">
                  <span style={{ fontSize: 26, display: "inline-block", animation: "chefLean 1.1s ease-in-out infinite" }}>👨‍🍳</span>
                  {tossAt === activeInput && (
                    <span key={activeInput} style={{ position: "absolute", left: 22, top: 2, fontSize: 16, display: "inline-block", animation: "ingToss 0.7s ease-out" }}>{["🥕", "🧅", "🍅", "🧄"][activeInput]}</span>
                  )}
                </div>
              )}
            {INPUTS.map((inp, inpIdx) => {
              const st = inputs[inp.id];
              const ING = ["🥕", "🧅", "🍅", "🧄"];   // one ingredient per input row
              return (
                <div key={inp.id} ref={(el) => (rowRefs.current[inpIdx] = el)} style={{ border: `1px solid ${st.on ? BLUE : LINE}`, borderRadius: 10, marginBottom: 8, background: "#fff", overflow: "hidden" }}>
                  <label style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", cursor: "pointer", background: st.on ? BLUE_CARD : "#fff" }}>
                    <input type="checkbox" checked={st.on} onChange={() => toggle(inp.id)} style={{ accentColor: BLUE, width: 15, height: 15 }} />
                    <span style={{ fontSize: 9.5, fontWeight: 800, color: "#0A3D7A", background: "#fff", border: `1px solid ${BLUE}`, borderRadius: 4, padding: "1px 6px" }}>{inp.id}</span>
                    <span style={{ fontSize: 12.5, fontWeight: 600, color: NAVY }}>{inp.name}</span>
                    {inp.primary && (
                      <span style={{ fontSize: 9, fontWeight: 800, letterSpacing: 0.5, color: "#fff", background: PURPLE_BRIGHT, borderRadius: 4, padding: "1px 6px" }}>PRIMARY</span>
                    )}
                  </label>
                  {st.on && (
                    <div style={{ borderTop: `1px solid ${LINE}` }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", flexWrap: "wrap" }}>
                        <label style={attachBtn}>Attach documents<input type="file" multiple accept=".pdf,.docx,.pptx,.xlsx,.xlsm,.xls,.csv,.tsv,.doc,.ppt,application/pdf,image/*,.png,.jpg,.jpeg,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" style={{ display: "none" }} onChange={(e) => onFiles(inp.id, e.target.files)} /></label>
                        <span style={{ fontSize: 10.5, color: MUTED }}>PDF, image, Word (.docx), PowerPoint (.pptx), Excel (.xlsx/.xls) or CSV · multiple allowed</span>
                      </div>
                      {(st.files || []).length > 0 && (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, padding: "0 12px 8px" }}>
                          {st.files.map((f, fi) => {
                            const ok = ["pdf", "image", "extracted"].includes(f.kind);
                            const bad = ["legacy", "error", "other"].includes(f.kind);
                            const bg = ok ? GREEN_CARD : bad ? AMBER_CARD : BLUE_CARD;
                            const fg = ok ? GREEN : bad ? AMBER : BLUE;
                            const icon = f.kind === "extracting" ? "⏳ " : ok ? "📎 " : "⚠ ";
                            return (
                              <span key={f.key || fi} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: bg, color: fg, fontSize: 11, fontWeight: 600, borderRadius: 6, padding: "3px 8px" }}>
                                {icon}{f.name}{f.kind === "extracted" ? " · text extracted" : f.kind === "extracting" ? " · reading…" : ""}
                                <span onClick={() => clearFile(inp.id, fi)} style={{ cursor: "pointer", fontWeight: 800 }}>×</span>
                              </span>
                            );
                          })}
                        </div>
                      )}
                      {(st.files || []).some((f) => f.kind === "legacy") && <div style={{ fontSize: 11, color: AMBER, padding: "0 12px 8px" }}>Legacy .doc/.ppt can't be parsed in-browser. Save as .docx/.pptx, or paste the text below.</div>}
                      {(st.files || []).some((f) => f.kind === "other") && <div style={{ fontSize: 11, color: AMBER, padding: "0 12px 8px" }}>Some file types can't be read. Attach PDF/image/.docx/.pptx/.xlsx/.csv, or paste the text below.</div>}
                      {(st.files || []).some((f) => f.kind === "error") && <div style={{ fontSize: 11, color: AMBER, padding: "0 12px 8px" }}>Couldn't extract text from a file. Paste the key sections below instead.</div>}
                      {(st.files || []).some((f) => f.big) && <div style={{ fontSize: 11, color: AMBER, padding: "0 12px 8px" }}>Large file — reading may take longer. If it fails, paste the key sections.</div>}
                      <textarea value={st.text} onChange={(e) => setText(inp.id, e.target.value)} placeholder={inp.ph} rows={2}
                        style={{ width: "100%", border: "none", borderTop: `1px solid ${LINE}`, padding: "9px 12px", fontSize: 12.5, fontFamily: "inherit", color: INK, resize: "vertical", outline: "none", boxSizing: "border-box" }} />
                    </div>
                  )}
                </div>
              );
            })}
            </div>

            <div style={{ display: "flex", gap: 8, margin: "12px 0", flexWrap: "wrap" }}>
              {!running ? <button onClick={runLoop} disabled={!anyReady} style={{ ...btn(PURPLE, "#fff"), opacity: anyReady ? 1 : 0.5, cursor: anyReady ? "pointer" : "not-allowed" }}>▶ Run agent loop</button> : <button onClick={stop} disabled={stopRef.current} style={{ ...btn(RED, "#fff"), opacity: stopRef.current ? 0.6 : 1, cursor: stopRef.current ? "wait" : "pointer" }}>{stopRef.current ? "■ Stopping…" : "■ Stop"}</button>}
              {hasContent && <button onClick={downloadPM15} style={btn("#fff", PURPLE, `1px solid ${PURPLE}`)}>⬇ Download charter (PM_15 Word)</button>}
              {hasContent && <button onClick={downloadAnnex} style={btn("#fff", "#2B0A3D", `1px solid #460073`)}>⬇ Download Charter Annex (Word)</button>}
            </div>
            {hasFrozen && (
              <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: NAVY, margin: "-4px 0 10px", cursor: "pointer" }}>
                <input type="checkbox" checked={regenFromFrozen} onChange={(e) => setRegenFromFrozen(e.target.checked)} />
                <span>❄ Regenerate from frozen evidence (skip extraction) — identical facts every run. Uncheck to re-read the SOW.</span>
              </label>
            )}
            {hasContent && !done && <div style={{ fontSize: 11.5, color: MUTED, margin: "-4px 0 10px" }}>Downloads reflect current progress ({validatedCount}/11 validated) — you can grab the charter any time, even before the run finishes.</div>}

            {backendStatus === "down" && (
              <div style={{ background: AMBER_CARD, color: AMBER, border: `1px solid ${AMBER}`, borderRadius: 8, padding: 12, fontSize: 13, marginBottom: 12 }}>
                ⚠ Can't reach the model backend at <code style={{ fontFamily: "monospace" }}>{API}</code>. Start your server and make sure it exposes a streaming <code style={{ fontFamily: "monospace" }}>POST /api/messages</code> before running (or set <code style={{ fontFamily: "monospace" }}>MODEL_TRANSPORT = "direct"</code> if you use a network proxy).{" "}
                <span onClick={checkBackend} style={{ textDecoration: "underline", cursor: "pointer", fontWeight: 700 }}>Re-check</span>
              </div>
            )}
            {injectionFlags.length > 0 && (
              <div style={{ background: AMBER_CARD, color: AMBER, border: `1px solid ${AMBER}`, borderRadius: 8, padding: 12, fontSize: 13, marginBottom: 12 }}>
                ⚠ Injection screen: {injectionFlags.length} possible embedded instruction(s) found in the document — treated as data, not obeyed, and flagged for review:
                <ul style={{ margin: "6px 0 0", paddingLeft: 18 }}>{injectionFlags.map((f, i) => <li key={i} style={{ fontSize: 11 }}>{f}</li>)}</ul>
              </div>
            )}
            {error && <div style={{ background: RED_CARD, color: RED, border: `1px solid ${RED}`, borderRadius: 8, padding: 12, fontSize: 13, marginBottom: 12 }}>{error}</div>}

            <div style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, marginBottom: 6 }}>
                <span style={{ fontWeight: 700, color: NAVY }}>Completion bar</span>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  {(running || done || hasContent) && (
                    <span style={{ fontFamily: "monospace", fontSize: 11.5, fontWeight: 700, color: running ? PURPLE_BRIGHT : (done ? GREEN : MUTED), background: running ? "#F3E8FF" : (done ? GREEN_CARD : "#F1EFE8"), borderRadius: 12, padding: "2px 9px" }} title="Time from Run to completion">
                      ⏱ {fmtTime(elapsedMs)}
                    </span>
                  )}
                  {(running || done) && (tokenUsage.in > 0 || tokenUsage.out > 0) && (
                    <span style={{ fontFamily: "monospace", fontSize: 11, fontWeight: 700, color: "#0A3D7A", background: BLUE_CARD, borderRadius: 12, padding: "2px 9px" }}
                      title={`Input tokens: ${tokenUsage.in.toLocaleString()} · Output tokens: ${tokenUsage.out.toLocaleString()} · Rate: input $3/M, output $15/M (claude-sonnet-4-6)`}>
                      🪙 {((tokenUsage.in + tokenUsage.out)/1000).toFixed(1)}k tok · {_fmtCost()}
                    </span>
                  )}
                  <span style={{ fontFamily: "monospace", fontSize: 11, fontWeight: 700, color: NAVY, background: "#EEF2F7", borderRadius: 12, padding: "2px 9px" }} title={runHistory.length > 0 ? `Average over ${runHistory.length} completed charter${runHistory.length > 1 ? "s" : ""}${window.storage ? "" : " this session"}. Last: ${fmtTime(runHistory[runHistory.length - 1])}` : "Average time will appear here once a charter finishes. Only fully completed runs are counted."}>
                    {runHistory.length > 0
                      ? `avg ${fmtTime(Math.round(runHistory.reduce((a, b) => a + b, 0) / runHistory.length))} · n=${runHistory.length}`
                      : "avg — · n=0"}
                  </span>
                  <span style={{ color: validatedCount === 11 ? GREEN : MUTED, fontWeight: 700 }}>{validatedCount}/11 validated{running ? ` · cycle ${cycle}` : ""}</span>
                </span>
              </div>
              <div style={{ height: 10, background: "#F1EFE8", borderRadius: 6, overflow: "hidden" }}>
                <div style={{ width: `${(validatedCount / 11) * 100}%`, height: "100%", background: validatedCount === 11 ? GREEN : PURPLE, transition: "width .4s" }} />
              </div>
            </div>

            {coverage && coverage.length > 0 && (() => {
              // The coverage output names sections using the HEADING_DICTIONARY keys, so
              // match against those (not STANDARD_SECTIONS, whose labels differ slightly).
              const DICT_KEYS = Object.keys(HEADING_DICTIONARY);
              const isStandard = (s) => DICT_KEYS.includes(s.section);
              const standard = coverage.filter(isStandard);
              const extra = coverage.filter((s) => !isStandard(s));
              const presentCount = standard.filter((s) => s.present).length;
              return (
              <div style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <span style={{ fontWeight: 700, color: NAVY, fontSize: 12 }}>SOW Coverage Report</span>
                  <span style={{ fontSize: 10, color: MUTED }}>{presentCount}/{DICT_KEYS.length} standard sections present{extra.length ? ` · ${extra.length} other heading(s) → Annex` : ""}</span>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {standard.map((s, i) => (
                    <span key={i} style={{ fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 12, border: `1px solid ${s.present ? GREEN : AMBER}`, color: s.present ? GREEN : AMBER, background: s.present ? GREEN_CARD : AMBER_CARD }}>
                      {s.present ? "✓" : "✗"} {s.section}
                    </span>
                  ))}
                </div>
                {extra.length > 0 && (
                  <div style={{ fontSize: 10.5, color: MUTED, marginTop: 8 }}>+ {extra.length} non-standard SOW heading(s) captured and classified by content (full list in the Charter Annex).</div>
                )}
                <div style={{ fontSize: 10.5, color: MUTED, marginTop: 8 }}>A ✗ means this SOW has no such section (verified by the section-locating pass) — a "not covered in SOW" flag on a related item is a real gap, not a miss.</div>
                {consistency && consistency.length > 0 && (
                  <div style={{ fontSize: 10.5, color: AMBER, background: AMBER_CARD, border: `1px solid ${AMBER}`, borderRadius: 6, padding: "6px 8px", marginTop: 8 }}>
                    ⚠ Cross-table date conflict(s) — same item, different dates: {consistency.slice(0, 4).join(" · ")}{consistency.length > 4 ? ` · +${consistency.length - 4} more` : ""}. Review against the SOW.
                  </div>
                )}
              </div>
              );
            })()}

            {pmReview && Array.isArray(pmReview.rubric) && pmReview.rubric.length > 0 && (
              <div style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 10, padding: 14, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <span style={{ fontWeight: 700, color: NAVY, fontSize: 12 }}>PM Pre-Ship Rubric</span>
                  <span style={{ fontSize: 11, fontWeight: 700, color: (pmReview.rubric.reduce((a, r) => a + (Number(r.score) || 0), 0) >= 14 ? GREEN : AMBER) }}>{pmReview.rubric.reduce((a, r) => a + (Number(r.score) || 0), 0)}/18 · {(pmReview.notes || []).length} PM flag(s) → annex</span>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {pmReview.rubric.map((r, i) => {
                    const c = r.score === 2 ? GREEN : r.score === 1 ? AMBER : "#B42318";
                    const bg = r.score === 2 ? GREEN_CARD : r.score === 1 ? AMBER_CARD : "#FBEAEA";
                    const label = (PM_RUBRIC[(r.n || 0) - 1] || `#${r.n}`).split(" — ")[0];
                    return <span key={i} title={r.note || ""} style={{ fontSize: 10.5, fontWeight: 600, padding: "2px 8px", borderRadius: 12, border: `1px solid ${c}`, color: c, background: bg }}>{r.score}/2 {label}</span>;
                  })}
                </div>
                <div style={{ fontSize: 10.5, color: MUTED, marginTop: 8 }}>Advisory PM self-check. Red-flag observations and the full rubric are in the Charter Annex — never in the charter itself.</div>
              </div>
            )}

            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 1.2, color: NAVY, marginBottom: 8 }}>CHARTER STATE (empty → drafted → validated)</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
              {state.map((e) => {
                const s = STATUS_STYLE[e.status];
                return (
                  <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "#fff", border: `1px solid ${LINE}`, borderRadius: 8, padding: "7px 10px" }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: s.dot, flexShrink: 0 }} />
                    <span style={{ fontSize: 11, color: MUTED, width: 18, flexShrink: 0 }}>{e.id}</span>
                    <span style={{ fontSize: 12.5, color: INK, flex: 1 }}>{e.name}</span>
                    {e.coverage && <span style={{ fontSize: 10, color: MUTED }}>{e.coverage}</span>}
                    <span style={{ background: s.bg, color: s.fg, fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 12 }}>{s.label}</span>
                  </div>
                );
              })}
            </div>
          </div>

          <div>
            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 1.2, color: NAVY, marginBottom: 8 }}>AGENT TRACE (plan · act · critique · update)</div>

            {/* KITCHEN SCENE (UI only) — a little kitchen with three stations. The cook stands at
                the station for the current phase: idle → prep board (chopping), running → stove
                (stirring, steam), done → plating (serves the dish). Never touches the charter/annex. */}
            {(() => {
              const phase = done ? "plate" : running ? "stove" : "prep";
              const cookLeft = phase === "prep" ? "8%" : phase === "stove" ? "45%" : "78%";
              const label = stopping ? "Stopping — finishing the current step…" : phase === "prep" ? "Prepping the ingredients" : phase === "stove" ? "Cooking the charter" : "Served — charter ready";
              const bg = stopping ? "#FBEDED" : phase === "plate" ? "#F1FAF4" : phase === "stove" ? "#FBF6FF" : "#FAFAFC";
              return (
                <div style={{ position: "relative", height: 96, border: `1px solid ${LINE}`, borderRadius: 10, background: bg, overflow: "hidden", marginBottom: 10, opacity: stopping ? 0.55 : 1, transition: "opacity .25s, background .25s", animation: (phase === "stove" && !stopping) ? "counterGlow 2.4s ease-in-out infinite" : "none" }}>
                  {/* counter line */}
                  <div style={{ position: "absolute", left: 0, right: 0, bottom: 22, height: 3, background: "#E4DEF0" }} />
                  {/* station 1: prep board */}
                  <div style={{ position: "absolute", left: "8%", bottom: 26, transform: "translateX(-50%)", textAlign: "center", opacity: phase === "prep" ? 1 : 0.45 }}>
                    <span style={{ fontSize: 24 }}>🔪</span><div style={{ fontSize: 20, marginTop: -4 }}>🥬</div>
                  </div>
                  {/* station 2: stove */}
                  <div style={{ position: "absolute", left: "45%", bottom: 26, transform: "translateX(-50%)", textAlign: "center", opacity: phase === "stove" ? 1 : 0.45 }}>
                    {phase === "stove" && <span style={{ position: "absolute", left: "50%", top: -16, transform: "translateX(-50%)", fontSize: 16, animation: "sizzle 1.3s ease-in-out infinite" }}>♨️</span>}
                    <span style={{ fontSize: 26 }}>🍲</span><div style={{ fontSize: 16, marginTop: -6 }}>🔥</div>
                  </div>
                  {/* station 3: plating */}
                  <div style={{ position: "absolute", left: "78%", bottom: 26, transform: "translateX(-50%)", textAlign: "center", opacity: phase === "plate" ? 1 : 0.45 }}>
                    <span style={{ fontSize: 26, display: "inline-block", animation: phase === "plate" ? "servePop .6s ease-out" : "none" }}>🍽️</span>
                    {phase === "plate" && <span style={{ position: "absolute", left: "70%", top: -6, fontSize: 16, animation: "servePop .6s ease-out .2s both" }}>✨</span>}
                  </div>
                  {/* the cook — moves to the active station */}
                  <div style={{ position: "absolute", bottom: 24, left: cookLeft, transform: "translateX(-50%)", transition: "left 1.1s cubic-bezier(.5,.05,.3,1)", textAlign: "center" }}>
                    {phase === "prep" && <span style={{ position: "absolute", left: 18, top: 2, fontSize: 15, animation: "cleaverChop .5s ease-in-out infinite" }}>🔪</span>}
                    <span style={{ fontSize: 34, display: "inline-block", animation: phase === "stove" ? "chefStir .9s ease-in-out infinite" : phase === "prep" ? "hopPrep .6s ease-in-out infinite" : "tada 1.2s ease-in-out" }}>👨‍🍳</span>
                  </div>
                  {/* phase caption */}
                  <div style={{ position: "absolute", left: 10, top: 8, fontSize: 10.5, fontWeight: 700, letterSpacing: 0.4, color: phase === "plate" ? GREEN : phase === "stove" ? PURPLE : MUTED }}>{label}</div>
                </div>
              );
            })()}

            <div style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 10, padding: 12, height: 220, overflowY: "auto", fontSize: 12, marginBottom: 14 }}>
              {log.length === 0 && <div style={{ color: MUTED, textAlign: "center", padding: "70px 0" }}>The agent's decisions will stream here.</div>}
              {log.map((l, i) => {
                const ls = logStyle[l.kind] || { fg: INK, icon: "·" };
                return <div key={i} style={{ display: "flex", gap: 8, marginBottom: 5, lineHeight: 1.4 }}><span style={{ color: ls.fg, fontWeight: 700, flexShrink: 0 }}>{ls.icon}</span><span>{l.text}</span></div>;
              })}
            </div>

            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 1.2, color: NAVY, marginBottom: 8 }}>DRAFTED / VALIDATED CONTENT</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {state.filter((e) => (e.bullets && e.bullets.length) || (e.tables && e.tables.length)).length === 0 && <div style={{ border: `1px dashed ${LINE}`, borderRadius: 10, padding: 26, textAlign: "center", color: MUTED, fontSize: 13, background: "#fff" }}>Component content appears here as the agent drafts and validates each one.</div>}
              {state.filter((e) => (e.bullets && e.bullets.length) || (e.tables && e.tables.length)).map((e) => {
                const s = STATUS_STYLE[e.status];
                return (
                  <div key={e.id} style={{ background: "#fff", border: `1px solid ${LINE}`, borderRadius: 10, overflow: "hidden" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", background: "#FAF7FE", borderBottom: `1px solid ${LINE}` }}>
                      <span style={{ width: 20, height: 20, borderRadius: 5, background: s.dot, color: "#fff", fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{e.id}</span>
                      <span style={{ fontSize: 12.5, fontWeight: 700, color: PURPLE, flex: 1 }}>{e.name}</span>
                      {e.coverage && <span style={{ fontSize: 11, color: MUTED }}>{e.coverage}</span>}
                      <span style={{ background: s.bg, color: s.fg, fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 12 }}>{s.label}</span>
                    </div>
                    <div style={{ padding: "9px 12px" }}>
                      {e.bullets && e.bullets.length > 0 && (
                        <ul style={{ margin: 0, paddingLeft: 18 }}>
                          {e.bullets.map((b, i) => (
                            <li key={i} style={{ fontSize: 12.5, color: INK, lineHeight: 1.5, marginBottom: 4 }}>
                              {b.text} <span style={{ background: BLUE_CARD, color: "#0A3D7A", fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 3, whiteSpace: "nowrap" }}>{b.source || "?"}</span>
                            </li>
                          ))}
                        </ul>
                      )}
                      {e.tables && e.tables.map((t, ti) => (
                        <div key={ti} style={{ marginTop: 8 }}>
                          <div style={{ fontSize: 11.5, fontWeight: 700, color: INK, marginBottom: 3 }}>{t.title} <span style={{ background: BLUE_CARD, color: "#0A3D7A", fontSize: 9, fontWeight: 700, padding: "1px 5px", borderRadius: 3 }}>{t.source || "?"}</span></div>
                          <div style={{ overflowX: "auto" }}>
                            <table style={{ borderCollapse: "collapse", width: "100%", fontSize: 11 }}>
                              <tbody>
                                <tr>{(t.columns || []).map((cH, ci) => <td key={ci} style={{ background: "#EEE9F5", color: PURPLE, fontWeight: 700, padding: "3px 7px", border: `1px solid ${LINE}` }}>{cH}</td>)}</tr>
                                {(t.rows || []).map((r, ri) => <tr key={ri}>{(r || []).map((cellVal, ci) => <td key={ci} style={{ padding: "3px 7px", border: `1px solid ${LINE}`, color: INK, verticalAlign: "top" }}>{cellVal}</td>)}</tr>)}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      ))}
                      {e.flags?.length > 0 && e.flags.map((f, i) => <div key={i} style={{ marginTop: 6, background: RED_CARD, color: RED, fontSize: 11, borderRadius: 6, padding: "4px 8px" }}>⚑ {f}</div>)}
                      {e.checklist && e.checklist.length > 0 && (
                        <div style={{ marginTop: 8, borderTop: `1px solid ${LINE}`, paddingTop: 6 }}>
                          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.8, color: MUTED, marginBottom: 4 }}>OUTPUT-SPEC CHECKLIST</div>
                          {e.checklist.map((c, i) => {
                            const vs = c.verdict === "covered" ? { fg: GREEN, mark: "✓" } : c.verdict === "partial" ? { fg: AMBER, mark: "~" } : { fg: RED, mark: "✗" };
                            return (
                              <div key={i} style={{ display: "flex", gap: 6, fontSize: 11, marginBottom: 2, lineHeight: 1.35 }}>
                                <span style={{ color: vs.fg, fontWeight: 700, flexShrink: 0, width: 12 }}>{vs.mark}</span>
                                <span style={{ color: INK }}>{c.item}{c.note && c.verdict !== "covered" ? <span style={{ color: vs.fg }}> — {c.note}</span> : null}</span>
                              </div>
                            );
                          })}
                        </div>
                      )}
                      {e.status === DRAFTED && e.needsReview && <div style={{ marginTop: 6, background: RED_CARD, color: RED, fontSize: 11, borderRadius: 6, padding: "5px 8px" }}>⚑ Best draft after 3 attempts — needs human review.</div>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CharterAgentSpec />);
  </script>
</body>
</html>
