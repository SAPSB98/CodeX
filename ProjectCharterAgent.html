- FINANCIAL EXCLUSION (absolute): output NO monetary values — no fees, rates, costs, payment amounts, currency or budget figures, even if present in the SOW; never emit a fee/cost column. A payment-linked milestone keeps its name and date only.

GLOBAL FORMAT RULES:
- No prose paragraphs. Every point is ONE single-sentence bullet or a table row.
- These components are TABLES: Objectives, Milestones, Risks, Assumptions & Constraints, Stakeholders.
- Budgets are DISPLAY caps: capture everything, rank by importance/severity, show what fits, and add a "flags" count line naming what overflows to the annex (e.g. "18 captured from SOW; 7 shown; remainder to Annex").
RULES: ${AGENT_RULES.join(" ")}

PM CRAFT (shapes wording, attention and DISPLAY ORDER only — never adds content): ${PM_PERSONA}
${CHARTER_VOICE}
${RANK_HEURISTICS[comp.id] ? RANK_HEURISTICS[comp.id] : ""}

SOURCE TAGGING (provenance): tag each bullet and table by the DOCUMENT it came from. The only document sources supplied this run are: ${allowed}. Use these codes only; a risk or stakeholder taken from the SOW is tagged "SOW", never by topic. If a required line item has no support in the SOW, do not invent a source — output "not covered in SOW" and add a "flags" note.
Return ONLY JSON:
{"bullets":[{"text":"<point with inline (SOW §x) tag>","source":"${(activeCodes && activeCodes[0]) || "SOW"}"}],"tables":[{"title":"<t>","source":"${(activeCodes && activeCodes[0]) || "SOW"}","columns":["Col A","Col B"],"rows":[["a1","b1"],["a2","b2"]]}],"flags":["<count lines / not-covered notes>"]}`;
  // Slice digest ≤80 000 chars so the request body stays within corporate proxy limits.
  // All other API calls in this file already slice; drafter + critic are the two that needed it.
  const msg = `INPUTS:\n${digest.slice(0, 80000)}\n\n${ctx ? ctx + "\n\n" : ""}${priorCritique ? `Previous draft REJECTED — fix: ${priorCritique}\n\n` : ""}Draft component ${comp.id}.`;
  return callJSON(msg, sys, 2600, signal, 0.4);   // 2600 keeps generation under ~43 s; same cap as registry
}

async function critic(comp, draftContent, digest, signal) {
  const sys = `You are the CRITIC. Check a drafted charter component against EACH of its required Output-Spec line items, one by one. Be strict and literal.
Component ${comp.id}: "${comp.name}"
Required line items:
${comp.items.map((it, i) => `${i + 1}. ${it}`).join("\n")}
EXPECTED FORMAT (v3.7 Output Spec): ${specText(comp)}
For EACH numbered line item, return a verdict:
- "covered": the draft fully addresses this line item with specific, sourced content.
- "partial": the draft touches it but is vague, incomplete, or missing a required detail (e.g. an objective without a number+date is at most "partial").
- "missing": the draft does not address this line item at all.
Rules that force "partial" or "missing": ANY content not traceable to a real SOW source (a clause §, a page, a figure/exhibit ref) — mark it a capture violation; a bullet or row with NO source reference at all (invented / manufactured / borrowed) — this is the most serious violation, mark missing; a manufactured stand-in series (e.g. "Invoice Month 1..N" built from a fees schedule) — invented, mark missing; a fact that CONTRADICTS the fact registry in the inputs (a date/wave/entity different from the registry value) — mark missing (registry is the source of truth); a bullet/row missing its inline SOW clause tag; an objective lacking a number, a date, or a source clause; a milestone showing an agent-computed date instead of a SOW date, "date per project plan", or "UNREADABLE"; a required line fabricated where the SOW is silent (must read "not covered in SOW" or be dropped); a component required as a TABLE but drafted without one; ANY monetary value present (fee, rate, cost, payment amount, currency, budget) — financial-exclusion violation, mark missing; for the milestone/schedule component, a group (wave/phase/release/whatever the SOW uses) summarised to a single row instead of its full milestone list, OR a missing completeness note of the form "SOW defines N group(s); charter covers N". Long content broken into several short bullet lines is CORRECT and must NOT be penalised. IMPORTANT — do NOT penalise correct SOW-silence: for extraction-only items (PM authority/escalation, sponsor authority/role, stop conditions), if the SOW is silent and the draft correctly dropped the line or wrote "not covered in SOW", mark that line item COVERED. Likewise, if component 2 finds few measurable objectives and the draft says so, that is COVERED, not missing.
Return ONLY JSON — one entry per line item, in order:
{"checklist":[{"item":"<short label of line item 1>","verdict":"covered|partial|missing","note":"<≤10 words, only if partial/missing>"}]}`;
  const msg = `INPUTS:\n${digest.slice(0, 80000)}\n\nDRAFT:\n${draftContent}\n\nGive a per-line-item checklist verdict, in order, one entry per required line item.`;
  return callJSON(msg, sys, 600, signal);
}

function CharterAgentSpec() {
  const [inputs, setInputs] = useState(INPUTS.reduce((a, i) => ({ ...a, [i.id]: { on: false, text: "", files: [] } }), {}));
  const [state, setState] = useState(COMPONENTS.map((c) => ({ ...c, status: EMPTY, bullets: [], tables: [], flags: [], missing: [], checklist: [], coverage: "", critique: "", attempts: 0, needsReview: false })));
  const [running, setRunning] = useState(false);
  const [log, setLog] = useState([]);
  const [cycle, setCycle] = useState(0);
  const [done, setDone] = useState(false);
  const [error, setError] = useState("");
  const [projectMeta, setProjectMeta] = useState({ client: "", project: "" });
  const [elapsedMs, setElapsedMs] = useState(0);   // end-to-end run timer
  const [runHistory, setRunHistory] = useState([]);   // durations (ms) of completed charter runs
  const [tokenUsage, setTokenUsage] = useState({ in: 0, out: 0 });
  const rowRefs = useRef([]);                          // measured positions of the 4 input rows
  const [chefTop, setChefTop] = useState(0);           // roaming cook's vertical position (px), matched to the active row
  const [activeInput, setActiveInput] = useState(0);   // which input row the cook is currently at
  const [tossAt, setTossAt] = useState(-1);            // row index where the ingredient is being tossed (after arrival)
  const [stopping, setStopping] = useState(false);     // true from Stop click until the run actually halts (instant UI feedback)
  const [coverage, setCoverage] = useState(null);  // v3.1 SOW Coverage Report (stopgap UI panel)
  const [hasFrozen, setHasFrozen] = useState(false);      // an evidence ledger has been frozen this session
  const [regenFromFrozen, setRegenFromFrozen] = useState(false);  // reuse frozen evidence on next run
  const frozenRef = useRef(null);                   // frozen evidence ledger {registry,digest,coverage,when}
  const [consistency, setConsistency] = useState(null);  // v3.2 cross-table date conflicts
  const [pmReview, setPmReview] = useState(null);  // PM_Skill: red-flag notes + rubric scorecard
  const [runId, setRunId] = useState(null);      // run ID returned by backend on save
  const [backendStatus, setBackendStatus] = useState(MODEL_TRANSPORT === "backend" ? "checking" : "skipped");  // model-proxy reachability
  const [injectionFlags, setInjectionFlags] = useState([]);   // SOW injection-screen hits (advisory)
  const stopRef = useRef(false);
  const abortRef = useRef(null);                    // aborts the in-flight fetch on Stop
  const startRef = useRef(0);
  const timerRef = useRef(null);
  const fileBlocksRef = useRef([]);                 // original image/PDF blocks, reused for vision passes
  const registryRef = useRef(null);                 // v3.2 single fact registry (source of truth for tables)

  // Load saved run-time history once, if persistent storage is available (else stays in-memory for the session).
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        if (typeof window !== "undefined" && window.storage && window.storage.get) {
          const r = await window.storage.get("charter_run_history", false);
          if (!cancelled && r && r.value) {
            const arr = JSON.parse(r.value);
            if (Array.isArray(arr)) setRunHistory(arr);
          }
        }
      } catch (_) { /* no persistence available — session-only history */ }
    })();
    return () => { cancelled = true; };
  }, []);

  // Ping the model backend on load so we can warn up front if it isn't running,
  // instead of only failing mid-run with "Failed to fetch". Any HTTP response (even a
  // 405 from a GET on the POST-only route) means the server is reachable; only a network
  // rejection (or a 4 s timeout) means it's down. Skipped entirely in "direct" mode.
  async function checkBackend() {
    if (MODEL_TRANSPORT !== "backend") { setBackendStatus("skipped"); return; }
    setBackendStatus("checking");
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    try { await fetch(API, { method: "GET", signal: ctrl.signal }); setBackendStatus("up"); }
    catch (_) { setBackendStatus("down"); }
    finally { clearTimeout(t); }
  }
  useEffect(() => { checkBackend(); }, []);   // eslint-disable-line react-hooks/exhaustive-deps

  // Roaming cook (UI only): while idle, step through the 4 input rows on a timer and
  // measure each row's REAL vertical offset, so the cook always lands on the right row
  // regardless of row heights, expansion, or a mid-run Stop. No percentage guessing.
  useEffect(() => {
    if (running || done) { setTossAt(-1); return; }   // cook only roams when idle
    let i = 0;
    let arriveTimer = null;
    const GLIDE = 950;          // must match the CSS transition duration below
    const HOLD = 700;           // pause at each row after arriving (ingredient shows here)
    const step = (idx) => {
      const el = rowRefs.current[idx];
      if (el) setChefTop(el.offsetTop + Math.max(0, (el.offsetHeight - 30) / 2));   // start gliding to the row
      setActiveInput(idx);
      setTossAt(-1);            // hide ingredient while travelling
      arriveTimer = setTimeout(() => setTossAt(idx), GLIDE);   // toss only AFTER the cook arrives
    };
    step(0);
    const id = setInterval(() => { i = (i + 1) % 4; step(i); }, GLIDE + HOLD);
    return () => { clearInterval(id); if (arriveTimer) clearTimeout(arriveTimer); };
  }, [running, done]);

  // Record a completed run's duration and persist (best-effort).
  function recordRunTime(ms) {
    if (!ms || ms < 500) return;   // ignore trivial/instant durations
    setRunHistory((prev) => {
      const next = [...prev, Math.round(ms)].slice(-100);   // keep last 100
      try { if (window.storage && window.storage.set) window.storage.set("charter_run_history", JSON.stringify(next), false); } catch (_) {}
      return next;
    });
  }

  const validatedCount = state.filter((e) => e.status === VALIDATED).length;
  const hasContent = state.some((e) => (e.bullets && e.bullets.length) || (e.tables && e.tables.length));
  const anyReady = INPUTS.some((i) => inputs[i.id].on && (inputs[i.id].text.trim() || (inputs[i.id].files || []).some((f) => f.kind === "pdf" || f.kind === "image")));
  const addLog = (kind, text) => setLog((l) => [...l, { kind, text }]);

  // v3.8 CONTAMINATION GUARD: any change to inputs invalidates the frozen ledger,
  // so a new/edited SOW can NEVER reuse a previous SOW's cached facts.
  function invalidateCache() {
    frozenRef.current = null;
    registryRef.current = null;
    fileBlocksRef.current = [];
    if (hasFrozen) setHasFrozen(false);
    if (regenFromFrozen) setRegenFromFrozen(false);
  }
  function toggle(id) { invalidateCache(); setInputs((p) => ({ ...p, [id]: { ...p[id], on: !p[id].on } })); }
  function setText(id, text) { invalidateCache(); setInputs((p) => ({ ...p, [id]: { ...p[id], text } })); }
  function clearFile(id, idx) { invalidateCache(); setInputs((p) => ({ ...p, [id]: { ...p[id], files: p[id].files.filter((_, i) => i !== idx) } })); }

  // Add/replace a file entry in the channel's files array by a stable key.
  function upsertFile(id, key, entry) {
    invalidateCache();
    setInputs((p) => {
      const files = [...(p[id].files || [])];
      const at = files.findIndex((f) => f.key === key);
      if (at >= 0) files[at] = { ...files[at], ...entry, key };
      else files.push({ ...entry, key });
      return { ...p, [id]: { ...p[id], files } };
    });
  }

  async function onFiles(id, fileList) {
    const arr = Array.from(fileList || []);
    for (const file of arr) await onFile(id, file);
  }

  async function onFile(id, file) {
    if (!file) return;
    const key = `${file.name}-${file.size}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
    const name = file.name.toLowerCase();
    const isPdf = file.type === "application/pdf" || name.endsWith(".pdf");
    const isImg = file.type.startsWith("image/");
    const isDocx = name.endsWith(".docx") || file.type.includes("wordprocessingml");
    const isPptx = name.endsWith(".pptx") || file.type.includes("presentationml");
    const isXlsx = name.endsWith(".xlsx") || name.endsWith(".xlsm") || name.endsWith(".xls") || file.type.includes("spreadsheetml") || file.type.includes("ms-excel");
    const isCsv = name.endsWith(".csv") || name.endsWith(".tsv") || file.type === "text/csv" || file.type === "text/tab-separated-values";
    const isDoc = name.endsWith(".doc");
    const isPpt = name.endsWith(".ppt");
    const big = file.size > MAX_SAFE_BYTES;

    // PDF & images: send natively to the API as document/image blocks
    if (isPdf || isImg) {
      const reader = new FileReader();
      reader.onload = () => {
        const b64 = String(reader.result).split(",")[1];
        upsertFile(id, key, { name: file.name, mediaType: isPdf ? "application/pdf" : file.type, data: b64, kind: isPdf ? "pdf" : "image", big });
      };
      reader.readAsDataURL(file);
      return;
    }

    // Word / PowerPoint: extract text in the browser; ALSO extract embedded images
    // (Gantts/schedules/tables often live only as pictures) and store them for vision.
    if (isDocx || isPptx) {
      upsertFile(id, key, { name: file.name, kind: "extracting" });
      try {
        const buf = await readArrayBuffer(file);
        const text = isDocx ? await extractDocx(buf) : await extractPptx(buf);
        let images = [];
        try { images = await extractOoxmlImages(buf); } catch (_) {}
        if (!text && !images.length) throw new Error("No text or images found in the file.");
        upsertFile(id, key, { name: file.name, kind: "extracted", images, imageCount: images.length });
        const note = images.length ? `\n[${file.name}: ${images.length} embedded image(s) will be read as figures]` : "";
        setInputs((p) => ({ ...p, [id]: { ...p[id], text: (p[id].text ? p[id].text + "\n\n" : "") + `[${file.name}]\n` + (text || "(no selectable text — images only)") + note } }));
      } catch (err) {
        upsertFile(id, key, { name: file.name, kind: "error", err: err.message });
      }
      return;
    }

    // Excel: flatten every sheet to text; ALSO extract embedded images (charts/Gantts
    // saved as pictures) for vision, exactly like Word/PowerPoint.
    if (isXlsx) {
      upsertFile(id, key, { name: file.name, kind: "extracting" });
      try {
        const buf = await readArrayBuffer(file);
        const text = await extractXlsx(buf);
        let images = [];
        try { images = await extractOoxmlImages(buf); } catch (_) {}   // .xls (non-zip) simply yields none
        if (!text && !images.length) throw new Error("No cell data or images found in the workbook.");
        upsertFile(id, key, { name: file.name, kind: "extracted", images, imageCount: images.length });
        const note = images.length ? `\n[${file.name}: ${images.length} embedded image(s) will be read as figures]` : "";
        setInputs((p) => ({ ...p, [id]: { ...p[id], text: (p[id].text ? p[id].text + "\n\n" : "") + `[${file.name}]\n` + (text || "(no cell text — images only)") + note } }));
      } catch (err) {
        upsertFile(id, key, { name: file.name, kind: "error", err: err.message });
      }
      return;
    }

    // CSV / TSV: plain text, read directly (no library needed).
    if (isCsv) {
      upsertFile(id, key, { name: file.name, kind: "extracting" });
      try {
        const text = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result || "").trim());
          r.onerror = () => rej(new Error("Could not read the file."));
          r.readAsText(file);
        });
        if (!text) throw new Error("The file appears to be empty.");
        upsertFile(id, key, { name: file.name, kind: "extracted", images: [], imageCount: 0 });
        setInputs((p) => ({ ...p, [id]: { ...p[id], text: (p[id].text ? p[id].text + "\n\n" : "") + `[${file.name}]\n` + text } }));
      } catch (err) {
        upsertFile(id, key, { name: file.name, kind: "error", err: err.message });
      }
      return;
    }

    if (isDoc || isPpt) { upsertFile(id, key, { name: file.name, kind: "legacy" }); return; }
    upsertFile(id, key, { name: file.name, kind: "other" });
  }

  function resetState() {
    setState(COMPONENTS.map((c) => ({ ...c, status: EMPTY, bullets: [], tables: [], flags: [], missing: [], checklist: [], coverage: "", critique: "", attempts: 0, needsReview: false })));
    setLog([]); setCycle(0); setDone(false); setError(""); setProjectMeta({ client: "", project: "" });
    setElapsedMs(0); setStopping(false); startRef.current = 0;   // clear any stale run timer
  }
  function resetAll() {
    setInputs(INPUTS.reduce((a, i) => ({ ...a, [i.id]: { on: false, text: "", files: [] } }), {}));
    resetState();
  }

  // Read attached files ONCE into a compact digest, then merge with pasted text.
  async function buildDigest(signal) {
    // Compute a stable content hash of ALL inputs (text + file data + names).
    const hashSource = INPUTS.map((inp) => {
      const st = inputs[inp.id];
      if (!st || !st.on) return "";
      const files = (st.files || []).map((f) => `${f.name}:${f.kind}:${(f.data || "").length}`).join(",");
      return `${inp.id}|${st.text || ""}|${files}`;
    }).join("||");
    let sowHash = "";
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(hashSource));
      sowHash = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
    } catch (_) { sowHash = ""; }   // if hashing fails, leave empty → never a cache hit (fail safe: re-extract)

    // REGENERATE FROM FROZEN EVIDENCE (v3.5) — explicit user choice, OR automatic
    // SOW-HASH CACHE (v3.7): identical input hash reuses the saved registry and skips
    // extraction entirely → byte-identical output, faster and cheaper.
    const cacheHit = !!sowHash && frozenRef.current && frozenRef.current.sowHash === sowHash;
    if ((regenFromFrozen && frozenRef.current) || cacheHit) {
      addLog("plan", cacheHit && !regenFromFrozen
        ? `SOW unchanged (hash ${sowHash}) — reusing cached evidence ledger, extraction skipped.`
        : "Regenerating from FROZEN evidence ledger — extraction skipped for reproducibility.");
      registryRef.current = frozenRef.current.registry || null;
      setCoverage(frozenRef.current.coverage || null);
      return frozenRef.current.digest || "";
    }
    const parts = [];
    INPUTS.forEach((inp) => {
      const st = inputs[inp.id];
      if (st.on && st.text.trim()) parts.push(`${inp.id} (${inp.name}):\n${st.text.trim()}`);
    });
    let digest = parts.join("\n\n");
    const pastedText = digest;   // preserved for Pass 2 (before Pass 1 appends vision extract)

    const fileBlocks = [];
    const roadmapBlocks = [];   // rendered roadmap/Gantt pages, kept for a focused date re-read
    const LARGE_PDF_PAGES = 25;   // above this, target pages instead of sending the whole PDF
    for (const inp of INPUTS) {
      const st = inputs[inp.id];
      if (!st.on) continue;
      for (const f of (st.files || [])) {
        if (f.kind === "image") {
          fileBlocks.push({ type: "text", text: `\n${inp.id} (${inp.name}) — image: ${f.name}` });
          // Resize large images so the request body stays within the corporate proxy limit
          const imgSrc = f.data.length > 100000 ? await shrinkImage(f.data, f.mediaType) : { data: f.data, mediaType: f.mediaType };
          fileBlocks.push({ type: "image", source: { type: "base64", media_type: imgSrc.mediaType, data: imgSrc.data } });
          continue;
        }
        // Embedded images extracted from a Word/PPT/Excel file — send to vision so
        // Gantts/schedules/tables that live ONLY as pictures get read (cap to keep payload sane).
        if (Array.isArray(f.images) && f.images.length) {
          const imgs = f.images.slice(0, 12);
          addLog("pass", `Reading ${imgs.length} embedded image(s) from ${f.name} as figures.`);
          // Use for..of (not forEach) so await shrinkImage works correctly
          for (let i = 0; i < imgs.length; i++) {
            const im = imgs[i];
            const imSrc = im.data.length > 100000 ? await shrinkImage(im.data, im.mediaType) : { data: im.data, mediaType: im.mediaType };
            const txt = { type: "text", text: `\n${inp.id} — ${f.name} embedded figure ${i + 1}` };
            const img = { type: "image", source: { type: "base64", media_type: imSrc.mediaType, data: imSrc.data } };
            fileBlocks.push(txt, img);
            roadmapBlocks.push(txt, img);   // available for the milestone/date re-read + audit pass
          }
          if (f.images._skippedVector) addLog("reject", `${f.name}: ${f.images._skippedVector} vector image(s) (EMF/WMF) can't be read — flag for manual review.`);
          if (f.images._skippedHeaderFooter) addLog("plan", `${f.name}: skipped ${f.images._skippedHeaderFooter} header/footer image(s) (branding/logos, not content).`);
        }
        if (f.kind !== "pdf") continue;

        // Try to read the PDF's pages. On failure, fall back to sending the whole file.
        let ext = null;
        try { ext = await pdfExtractPages(f.data); }
        catch (e) {
          if (e && e.name === "AbortError") throw e;
          addLog("reject", `Could not page-read ${f.name}; sending whole file.`);
          fileBlocks.push({ type: "text", text: `\n${inp.id} (${inp.name}) — ${f.name}` });
          fileBlocks.push({ type: "document", source: { type: "base64", media_type: "application/pdf", data: f.data } });
          continue;
        }

        if (ext.count <= LARGE_PDF_PAGES) {
          // Small PDF — send the whole document natively (cheap, complete).
          fileBlocks.push({ type: "text", text: `\n${inp.id} (${inp.name}) — ${f.name} (${ext.count} pp)` });
          fileBlocks.push({ type: "document", source: { type: "base64", media_type: "application/pdf", data: f.data } });
          continue;
        }

        // LARGE PDF — BATCH MODE (v3.5): read EVERY page in ≤12-page batches so no
        // page is skimmed or skipped. Each batch contributes text + rendered images;
        // results accumulate into the digest. Page-complete by construction.
        const BATCH = 12;
        const nBatches = Math.ceil(ext.count / BATCH);
        addLog("draft", `Large PDF (${ext.count} pp) — batch mode: ${nBatches} batch(es) of ${BATCH} pp.`);
        let batchDigest = "";
        let pagesRead = 0;
        for (let b = 0; b < nBatches; b++) {
          if (stopRef.current || (signal && signal.aborted)) break;
          const startP = b * BATCH + 1;
          const endP = Math.min(ext.count, startP + BATCH - 1);
          const batchNums = [];
          for (let p = startP; p <= endP; p++) batchNums.push(p);
          const batchText = batchNums.map((p) => `[p${p}] ${ext.pages[p - 1].text}`).join("\n");
          // Render pages that look like figures/roadmaps/payment-or-milestone tables so
          // image-only milestones and dates are captured. Broad triggers — a timeline or
          // payment table read as text alone yields almost nothing.
          const figPages = batchNums.filter((p) => {
            const tx = ext.pages[p - 1].text;
            const low = tx.toLowerCase();
            const sparse = tx.length < 400;                                    // diagram-like page
            const tableKw = /(milestone|payment|retention|indicative|go-?live|countries live|roadmap|gantt|timeline|wave\s*\d|rollout|cutover|hypercare|q-?gate|activate)/i.test(tx);
            const gridly = (tx.match(/\d{1,2}[\/\-]\d{1,2}/g) || []).length > 6 || (low.match(/wave/g) || []).length > 2;   // date-grid / many waves
            return sparse || tableKw || gridly;
          }).slice(0, 8);
          let imgs = [];
          if (stopRef.current || (signal && signal.aborted)) break;   // stop before the (slow) figure render
          if (figPages.length) {
            try { imgs = await renderPdfPages(ext.doc, figPages, 2.4); } catch (e) { if (e && e.name === "AbortError") throw e; }
          }
          const content = [
            { type: "text", text: `Extract charter-relevant facts from pages ${startP}–${endP} of a ${ext.count}-page SOW. Read the page TEXT below AND every attached page image (roadmaps, Gantts, schedule/milestone/payment tables, tables-as-pictures — dates and milestones often live ONLY in figures). Capture: purpose, objectives & dates, scope, requirements, deliverables, EVERY milestone with its date, risks (assumptions/dependencies/obligations), stakeholders, sponsor, PM authority, constraints, exit/hypercare.\nIMAGE TABLES & SCHEDULES — TRANSCRIBE VERBATIM: when a figure contains a table, schedule, Gantt or milestone grid, reproduce it EXACTLY as shown — its own column headers, its own row labels, its own dates/months, in its own order. Do NOT rename, re-map, re-order, summarise, or infer; transcribe what the image literally shows, tagged with the figure/page ref. If part of the image is not legibly readable, mark that cell 'UNREADABLE — HUMAN REVIEW' — never guess.\nNO INVENTION: only capture what is physically present. NEVER manufacture a series or stand-in (e.g. do not convert a fees/invoice schedule into 'Invoice Month 1..N' milestones). Drop money columns (financial exclusion) but keep the event/label and its date.\nTag each fact with its page (e.g. [p${startP}]). FINANCIAL EXCLUSION: never record fees, rates, costs, amounts or currency. Only what is present. If this batch has nothing charter-relevant, say 'nothing charter-relevant on pp ${startP}–${endP}'.\n\nPAGE TEXT:\n${batchText.slice(0, 24000)}` },
            ...imgs.map((im) => ({ type: "image", source: { type: "base64", media_type: im.mediaType, data: im.data } })),
          ];
          // Keep roadmap images available for the registry's focused date re-read.
          imgs.forEach((im) => {
            const txt = { type: "text", text: `\n${inp.id} — ${f.name} p${im.n}` };
            const img = { type: "image", source: { type: "base64", media_type: im.mediaType, data: im.data } };
            roadmapBlocks.push(txt, img);
          });
          try {
            if (stopRef.current || (signal && signal.aborted)) break;   // don't dispatch a new batch call after Stop
            const out = await apiRaw(content, "You extract concise, faithful, page-cited charter facts from one batch of SOW pages, including figures. Never invent; never record money.", 1500, signal, 0);
            if (out && !/^nothing charter-relevant/i.test(out.trim())) batchDigest += `\n[BATCH pp ${startP}-${endP}]\n${out}\n`;
            pagesRead = endP;
            addLog("pass", `Batch ${b + 1}/${nBatches} (pp ${startP}–${endP}) read${imgs.length ? ` · ${imgs.length} figure page(s)` : ""}.`);
          } catch (e) {
            if (e && e.name === "AbortError") throw e;
            addLog("reject", `Batch ${b + 1} (pp ${startP}–${endP}) failed: ${e.message}; continuing.`);
          }
        }
        digest = (digest ? digest + "\n\n" : "") + `BATCHED SOW EXTRACTION (${f.name} — ${pagesRead}/${ext.count} pp read in ${nBatches} batch(es)):\n${batchDigest}`;
        addLog(pagesRead >= ext.count ? "pass" : "reject", `Page coverage: ${pagesRead}/${ext.count} pp.${pagesRead < ext.count ? " INCOMPLETE — some batches did not complete." : ""}`);
      }
    }

    fileBlocksRef.current = fileBlocks;   // small vision set (roadmap pages / small docs / images)

    // Pass 1 runs when there is anything to read via vision, OR targeted text to interpret.
    if (fileBlocks.length > 0) {
      addLog("draft", "Pass 1 — reading documents (full sweep)…");
      const content = [
        { type: "text", text: "Read the attached material, INCLUDING any roadmap / Gantt / timeline images (milestones, waves and dates often exist ONLY in figures) AND the SOW TEXT below if present. Produce a COMPACT plain-text digest capturing only charter-relevant facts: purpose, objectives & dates, scope, requirements, milestones, risks, stakeholders, sponsor, PM, constraints, exit criteria. Note every delivery wave/phase and its dates, tagging figure-sourced facts with their reference. FINANCIAL EXCLUSION: never record monetary values. Under 800 words. No preamble." },
      ];
      if (digest) content.push({ type: "text", text: "SOW TEXT:\n" + digest.slice(0, 40000) });
      content.push(...fileBlocks);
      try {
        const extracted = await apiRaw(content, "You extract concise, faithful charter-relevant facts from documents. Never invent.", 1800, signal);
        digest = (digest ? digest + "\n\n" : "") + "FROM ATTACHED DOCUMENTS (PASS 1):\n" + extracted;
      } catch (e) {
        if (e && e.name === "AbortError") throw e;
        addLog("reject", `Pass 1 read failed (${e.message}); continuing with remaining passes.`);
      }
    }

    // ── PASS 2 (v3.1) — section-mapped extraction + SOW Coverage Report ──
    // Fixes false "not covered in SOW" flags: locate the SOW's standard sections,
    // then extract each charter component from its mapped sections via the
    // translation table. Union with Pass 1 — an item is captured if EITHER finds it.
    try {
      addLog("draft", "Pass 2 — locating SOW sections & extracting by map…");
      const p2instr =
        "You map and extract from a Statement of Work (SOW) for an SAP S/4HANA charter, working from the extracted SOW text below. STRICT: extract only what is present; NEVER invent, benchmark, or write boilerplate. FINANCIAL EXCLUSION: never extract monetary values (fees, rates, costs, payment amounts, currency); a payment-linked milestone keeps its name/date, never its amount.\n" +
        "STEP 1 — Locate the SOW's sections by matching its actual headings against this HEADING DICTIONARY (case-insensitive; numbered variants like '5. Scope of Services' count; a combined heading like 'Scope and Deliverables' maps to BOTH). A section counts as present if its content exists even under a synonym heading.\nHEADING DICTIONARY (standard section: recognised headings):\n" + HEADING_DICTIONARY_TEXT + "\n" +
        "STEP 2 — Using the translation table (charter need → where a SOW usually writes it), extract charter-relevant content for EACH of the 11 components from its mapped section(s). Clause-tag where the SOW numbers clauses.\n" +
        "TRANSLATION TABLE:\n" + TRANSLATION_TABLE_TEXT + "\n" +
        'Return ONLY JSON: {"coverage":[{"section":"<standard section name>","present":true|false,"matched_heading":"<the actual SOW heading that matched, or empty>"}],"unmapped":["<any SOW heading that matched NOTHING in the dictionary>"],"mapped":"<compact plain-text extraction organised by charter component 1..11, clause-tagged; write \'not present\' for a component whose mapped sections are absent>"}';
      // Text-only: Pass 2 reads Pass 1's extracted text + pasted text (images already
      // read in Pass 1). Avoids re-sending large images a second time.
      const p2content = [{ type: "text", text: p2instr }, { type: "text", text: "SOW TEXT (from Pass 1 + pasted input):\n" + digest.slice(0, 16000) }];
      const raw = await apiRaw(p2content, "You are a precise SOW section-mapper and extractor. You only extract what is present; you never invent.", 2600, signal);
      const parsed = extractJSON(raw);
      if (parsed && parsed.mapped) {
        digest = (digest ? digest + "\n\n" : "") + "FROM SECTION-MAPPED PASS (PASS 2, v3.1):\n" + parsed.mapped;
      }
      if (parsed && Array.isArray(parsed.coverage)) {
        // Attach matched heading (v3.7) so the Coverage Report is debuggable.
        const cov = parsed.coverage.map((s) => ({ ...s, matched_heading: s.matched_heading || "" }));
        if (Array.isArray(parsed.unmapped)) parsed.unmapped.filter(Boolean).forEach((h) => cov.push({ section: `Unmapped: "${h}" — classified by content`, present: true, matched_heading: h, unmapped: true }));
        setCoverage(cov);
        const present = cov.filter((s) => s.present && !s.unmapped).length;
        addLog("pass", `SOW Coverage: ${present}/${STANDARD_SECTIONS.length} standard sections present${Array.isArray(parsed.unmapped) && parsed.unmapped.length ? `; ${parsed.unmapped.length} unmapped heading(s)` : ""}.`);
      }
    } catch (e) { if (e && e.name === "AbortError") throw e; /* non-fatal: fall back to Pass 1 only */ }

    // ── SINGLE FACT REGISTRY (v3.2) — one source of truth for all tables ──
    // Consolidate every milestone, date, wave, entity and ID (from text AND
    // figures, both passes) into one registry. All components render facts FROM
    // this registry, so a date found once is available to every table, and
    // "date per project plan" is used only when the registry has no date at all.
    registryRef.current = null;
    try {
      addLog("draft", "Building the single fact registry (text + figures)…");
      const regInstr =
        "From the SOW (text AND every figure/diagram/roadmap/Gantt image), consolidate a single FACT REGISTRY. Read figures with vision — many dates live only there. STRICT: only facts present in the SOW; never invent. FINANCIAL EXCLUSION: never record monetary values.\n" +
        "MILESTONES & DATES — capture EVERY milestone from ALL sources, SOW-agnostic. The SOW may group milestones by wave, phase, release, workstream, or as one flat schedule — use its OWN grouping (set group empty if none). Read EVERY schedule/milestone/payment table EXHAUSTIVELY (every row, in order) — these are milestone sources; keep the milestone ID/name, group, and date/Indicative Month, drop money. Merge with timeline-figure dates (go-live/'Countries Live' per group). If a milestone appears twice, keep one row, prefer the most specific date. Never invent, pad, or template a milestone to reach a count — every row must trace to a real SOW row/page. A milestone with no date anywhere → date empty (renders 'date per project plan'); a date present but unreadable → 'UNREADABLE — HUMAN REVIEW' with ref, never a guess. Record a per-group count so completeness can be checked.\n" +
        "ALSO detect SCRUBBED / redacted identity fields (client name, sponsor, signatory, address, location, URL, employee name, email, phone, RFT/PO number). Clues: (1) visible masks like XXXX, [redacted], block-outs or blank runs = SCRUBBED; (2) a sentence whose grammar demands a value that is missing (e.g. 'between ____ and Accenture', or 'the Client' where a legal name belongs) = SCRUBBED; (3) an empty structure — a signature block, or address/email/phone label with no content = SCRUBBED; (4) no trace at all = NOT FOUND (you cannot tell scrubbing from genuine absence). NEVER create a fill for any FINANCIAL field (fee, price, rate, amount) — skip it entirely.\n" +
        'Return ONLY JSON: {"waves":[{"name":"<e.g. Wave 1>","scope":"<or \'to be defined\'>","golive":"<date or empty>"}],"milestones":[{"item":"<name as stated>","wave":"<wave or empty>","gate":"<Activate gate if mappable>","date":"<date/range as stated, or empty>","source":"<clause or figure ref, e.g. SOW: Exhibit 5>"}],"entities":[{"name":"<legal entity/country/system/ID>","kind":"<entity|country|system|id>","source":"<ref>"}],"figures":[{"ref":"<e.g. Exhibit 5>","readable":true,"note":"<what it shows>"}],"fills":[{"label":"<e.g. Client Name>","token":"[FILL: Client Name]","verdict":"SCRUBBED|NOT FOUND","clue":"<mask|broken-sentence|empty-structure|no-trace>"}]}';
      const regContent = [{ type: "text", text: regInstr }];
      if (digest) regContent.push({ type: "text", text: "SOW TEXT:\n" + digest.slice(0, 40000) });
      if (fileBlocks.length) regContent.push(...fileBlocks);
      const rawReg = await apiRaw(regContent, "You build a consolidated, source-tagged fact registry from a SOW including its figures. You never invent and never record money.", 2600, signal);
      const reg = extractJSON(rawReg);
      if (reg && typeof reg === "object") {
        registryRef.current = reg;
        let ms = Array.isArray(reg.milestones) ? reg.milestones : [];
        let dated = ms.filter((m) => m.date).length;

        // RETRY (v3.7): fire if (a) no dates read at all, (b) a declared group has ZERO
        // milestones, or (c) a group is THIN vs its peers (< half the busiest group and
        // < 5 rows) — a strong sign its table was under-read. Re-read timeline/table
        // images focused on recovering the missing rows. SOW-agnostic (group = wave/phase/etc).
        const groupsDeclared = (reg.waves || []).map((w) => (w.name || "").toLowerCase()).filter(Boolean);
        const groupCount = {};
        ms.forEach((m) => { const g = (m.wave || "").toLowerCase(); if (g) groupCount[g] = (groupCount[g] || 0) + 1; });
        const busiest = Math.max(0, ...Object.values(groupCount));
        const emptyGroups = groupsDeclared.filter((g) => !groupCount[g]);
        const thinGroups = Object.keys(groupCount).filter((g) => busiest >= 6 && groupCount[g] < Math.max(3, busiest / 2) && groupCount[g] < 5);
        const needsReread = dated === 0 || emptyGroups.length > 0 || thinGroups.length > 0;
        if (needsReread && (ms.length > 0 || (reg.waves || []).length > 0) && roadmapBlocks.length) {
          try {
            const targets = [...new Set([...emptyGroups, ...thinGroups])];
            addLog("draft", targets.length ? `Under-read group(s) [${targets.join(", ")}] — re-reading their tables/timeline…` : "No dates read — re-reading timeline pages…");
            const reInstr = "These images are milestone/schedule/payment tables, roadmaps, Gantts or program timelines from a SOW. Read EXHAUSTIVELY: for EVERY grouping (wave/phase/release or none) and EVERY milestone row shown, output the milestone ID/name, its group, and its date/Indicative Month read directly off the image." + (targets.length ? ` Pay special attention to these under-read groups: ${targets.join(", ")} — capture ALL their rows.` : "") + " STRICT: only what the image shows; never invent or pad. FINANCIAL EXCLUSION: no money. A date present but unreadable → 'UNREADABLE — HUMAN REVIEW' with ref. Return ONLY JSON: {\"milestones\":[{\"item\":\"<milestone id/name>\",\"wave\":\"<group>\",\"date\":\"<date/month as shown>\",\"source\":\"<page/figure ref>\"}]}";
            const rawRe = await apiRaw([{ type: "text", text: reInstr }, ...roadmapBlocks], "You read milestone tables and timelines off images exhaustively and precisely. Never invent.", 3000, signal, 0);
            const reParsed = extractJSON(rawRe);
            const reMs = reParsed && Array.isArray(reParsed.milestones) ? reParsed.milestones.filter((m) => m && (m.date || m.item)) : [];
            if (reMs.length) {
              const key = (m) => `${(m.item || "").toLowerCase()}|${(m.wave || "").toLowerCase()}`;
              const seen = new Set(ms.map(key));
              let added = 0;
              reMs.forEach((m) => { if (!seen.has(key(m))) { ms.push(m); added++; } });
              reg.milestones = ms;
              registryRef.current = reg;
              dated = ms.filter((m) => m.date).length;
              addLog("pass", `Table/timeline re-read recovered ${added} new milestone(s) across ${targets.length || "all"} group(s).`);
            } else {
              addLog("reject", "Re-read found nothing new — thin groups flagged for human verification.");
            }
          } catch (e) { if (e && e.name === "AbortError") throw e; }
        }

        const regText =
          "FACT REGISTRY (v3.2 — SINGLE SOURCE OF TRUTH; use these EXACT dates/waves/entities in ALL tables, do not re-derive; if an item has no date here, write 'date per project plan'):\n" +
          (Array.isArray(reg.waves) && reg.waves.length ? "WAVES:\n" + reg.waves.map((w) => `- ${w.name || "?"}: go-live ${w.golive || "date per project plan"}${w.scope ? ` — scope: ${w.scope}` : ""}`).join("\n") + "\n" : "") +
          (ms.length ? "MILESTONES:\n" + ms.map((m) => `- ${m.item || "?"}${m.wave ? ` [${m.wave}]` : ""}${m.gate ? ` (${m.gate})` : ""}: ${m.date || "date per project plan"}${m.source ? ` — ${m.source}` : ""}`).join("\n") + "\n" : "") +
          (Array.isArray(reg.entities) && reg.entities.length ? "ENTITIES/IDS: " + reg.entities.map((e) => e.name).filter(Boolean).join(", ") + "\n" : "");
        const fills = Array.isArray(reg.fills) ? reg.fills : [];
        const scrubbed = fills.filter((f) => f && /scrub/i.test(f.verdict || ""));
        const notFound = fills.filter((f) => f && /not\s*found/i.test(f.verdict || ""));
        let fillText = "";
        if (scrubbed.length) fillText += "SCRUBBED FIELDS — output the EXACT token at every point of use; NEVER guess and NEVER write 'not covered in SOW' for these:\n" + scrubbed.map((f) => `- ${f.label}: ${f.token || "[FILL: " + f.label + "]"}`).join("\n") + "\n";
        if (notFound.length) fillText += "NOT-FOUND FIELDS (scrubbed OR genuinely absent — cannot tell; write the token and the user verifies against the original): " + notFound.map((f) => f.label).join(", ") + "\n";
        digest = (digest ? digest + "\n\n" : "") + regText + (fillText ? "\n" + fillText : "");
        addLog("pass", `Fact registry: ${ms.length} milestone(s) (${dated} dated), ${(reg.waves || []).length} wave(s)${fills.length ? ", " + fills.length + " fill token(s)" : ""}.`);
        // Fold unreadable figures into the Coverage Report.
        const unreadable = (Array.isArray(reg.figures) ? reg.figures : []).filter((f) => f && f.readable === false);
        if (unreadable.length) {
          setCoverage((prev) => ([...(prev || []), ...unreadable.map((f) => ({ section: `Figure ${f.ref || "?"} — not machine-readable, manual review`, present: false }))]));
        }
      }
    } catch (e) { if (e && e.name === "AbortError") throw e; /* non-fatal: components fall back to digest text */ }

    // ── MISS-DETECTION & RECOVERY (v3.6) — the registry checks itself for holes ──
    try {
      const reg = registryRef.current || {};
      const ms = Array.isArray(reg.milestones) ? reg.milestones : [];
      const findings = [];

      // (a) ID CONTINUITY — sequences like WAVE_1_M1..M6, M8 (M7 missing) → gap.
      const idsByPrefix = {};
      ms.forEach((m) => {
        const id = String(m.item || "") + " " + String(m.gate || "");
        const mt = id.match(/([A-Za-z_][A-Za-z0-9_]*?[_\- ]?M)(\d{1,3})\b/);
        if (mt) { const pfx = mt[1].trim(); (idsByPrefix[pfx] = idsByPrefix[pfx] || []).push(parseInt(mt[2], 10)); }
      });
      Object.entries(idsByPrefix).forEach(([pfx, nums]) => {
        const set = new Set(nums), max = Math.max(...nums);
        const gaps = [];
        for (let i = 1; i <= max; i++) if (!set.has(i)) gaps.push(`${pfx}${i}`);
        if (gaps.length) findings.push(`ID gap: ${gaps.join(", ")} missing (have up to ${pfx}${max})`);
      });

      // (b) CROSS-MENTION — a stated count ("4 waves"/"N milestones") vs registry count.
      const dg = digest.toLowerCase();
      const waveClaim = dg.match(/(\d+)\s+waves?\b/);
      if (waveClaim) {
        const claimed = parseInt(waveClaim[1], 10);
        const have = (reg.waves || []).length || new Set(ms.map((m) => (m.wave || "").toLowerCase()).filter(Boolean)).size;
        if (claimed && have && claimed !== have) findings.push(`Count mismatch: text says ${claimed} waves, registry has ${have}`);
      }

      if (findings.length) {
        addLog("reject", `Miss-detection flagged ${findings.length} hole(s): ${findings.slice(0, 3).join("; ")}${findings.length > 3 ? "…" : ""}`);
        // Targeted audit re-read: inverted question over the roadmap/table images.
        if (roadmapBlocks.length && !(signal && signal.aborted) && !stopRef.current) {
          try {
            addLog("draft", "Audit re-read — recovering flagged gaps from figures…");
            const auditInstr = "AUDIT of a SOW milestone extraction. The registry flagged these gaps:\n- " + findings.join("\n- ") + "\nLook at the attached SOW milestone/schedule/timeline images and return ONLY the milestones that fill these gaps (the missing IDs, the missing wave's rows). STRICT: only what the image shows; never invent. FINANCIAL EXCLUSION: no money. Return ONLY JSON: {\"milestones\":[{\"item\":\"<id/name>\",\"wave\":\"<group>\",\"date\":\"<date/month>\",\"source\":\"<ref>\"}]}";
            const rawA = await apiRaw([{ type: "text", text: auditInstr }, ...roadmapBlocks], "You verify a SOW extraction against images and recover only genuinely missing items. Never invent.", 2000, signal, 0);
            const ap = extractJSON(rawA);
            const aMs = ap && Array.isArray(ap.milestones) ? ap.milestones.filter((m) => m && (m.item || m.date)) : [];
            if (aMs.length) {
              const key = (m) => `${(m.item || "").toLowerCase()}|${(m.wave || "").toLowerCase()}`;
              const seen = new Set(ms.map(key)); let added = 0;
              aMs.forEach((m) => { if (!seen.has(key(m))) { ms.push({ ...m, source: (m.source || "") + " [audit]" }); added++; } });
              reg.milestones = ms; registryRef.current = reg;
              // refresh the registry text in the digest so drafters see recovered rows
              digest += `\n\n[AUDIT-RECOVERED MILESTONES]\n` + aMs.map((m) => `- ${m.item}${m.wave ? ` [${m.wave}]` : ""}: ${m.date || "date per project plan"}${m.source ? ` — ${m.source}` : ""}`).join("\n");
              addLog(added ? "pass" : "reject", added ? `Audit pass recovered ${added} milestone(s) for flagged gaps.` : "Audit pass found no new rows — gaps flagged for human review.");
            } else {
              addLog("reject", "Audit pass recovered nothing — gaps stand, flagged for human review.");
            }
          } catch (e) { if (e && e.name === "AbortError") throw e; }
        }
        // Surface remaining findings in the Coverage Report for the human.
        setCoverage((prev) => ([...(prev || []), ...findings.map((f) => ({ section: `Miss-detection: ${f}`, present: false }))]));
      } else {
        addLog("pass", "Miss-detection: no ID gaps or count mismatches in the registry.");
      }
    } catch (e) { if (e && e.name === "AbortError") throw e; /* non-fatal */ }

    // FREEZE the evidence ledger (v3.5) so a re-run can regenerate identically.
    frozenRef.current = { registry: registryRef.current, digest: digest.trim(), coverage, sowHash, when: new Date().toISOString() };
    setHasFrozen(true);
    addLog("pass", `Evidence ledger frozen (SOW hash ${sowHash}). Re-running the same SOW will reuse it, byte-identical.`);

    // Prompt-injection screening — flag (never block) any embedded rule-override attempts.
    const _inj = screenInjection(digest);
    if (_inj.length) {
      setInjectionFlags(_inj);
      addLog("reject", `Injection screen: ${_inj.length} possible embedded instruction(s) in the document — treated as data, NOT obeyed; flagged for human review.`);
    } else {
      setInjectionFlags([]);
    }
    return digest.trim();
  }

  async function runLoop() {
    if (!anyReady) { setError("Turn on at least one input and attach a document or paste text."); return; }
    if (running) return;   // already running — ignore duplicate click
    setRunning(true); setError(""); setDone(false); stopRef.current = false;
    setCoverage(null);   // clear prior run's coverage report
    setConsistency(null);
    setPmReview(null);
    // Start the end-to-end timer.
    startRef.current = Date.now();
    setElapsedMs(0);
    if (timerRef.current) clearInterval(timerRef.current);
    _tok.in = 0; _tok.out = 0;
    setTokenUsage({ in: 0, out: 0 });
    timerRef.current = setInterval(() => {
      setElapsedMs(Date.now() - startRef.current);
      setTokenUsage({ in: _tok.in, out: _tok.out });
    }, 100);
    // Fresh abort controller for this run — Stop() calls .abort().
    const controller = new AbortController();
    abortRef.current = controller;
    const signal = controller.signal;
    const stopped = () => stopRef.current || signal.aborted;
    let working = COMPONENTS.map((c) => ({ ...c, status: EMPTY, bullets: [], tables: [], flags: [], missing: [], checklist: [], coverage: "", critique: "", attempts: 0, needsReview: false }));
    setState(working);
    const MAX_CYCLES = 60;      // hard safety cap
    const MAX_ATTEMPTS = 3;     // per-component tries before accepting best draft
    let c = 0;
    try {
      const digest = await buildDigest(signal);
      if (!digest) throw new Error("No readable input found. Attach a PDF/image or paste text.");
      if (stopped()) { addLog("plan", "Stopped."); return; }

      // Only the input channels actually supplied this run may be used as source tags.
      const activeCodes = INPUTS.filter((i) => {
        const st = inputs[i.id];
        return st && st.on && (st.text.trim() || (st.files || []).some((f) => f.kind === "pdf" || f.kind === "image" || f.kind === "extracted"));
      }).map((i) => i.id);

      // Extract the client / project name from the inputs for the charter cover page.
      addLog("plan", "Identifying client and project name from inputs…");
      try {
        const meta = await callJSON(
          `INPUTS:\n${digest.slice(0, 8000)}\n\nFrom these documents, identify the client/customer organisation name and the project or programme name.`,
          `You extract identifying names for a project charter cover page. Return ONLY JSON: {"client":"<customer/organisation name, or empty if not stated>","project":"<project or programme name, e.g. 'SAP S/4HANA Programme — Wave 2 & 3', or empty>"}. Use the exact names as written in the documents. If not stated, return empty strings — never invent.`,
          200, signal
        );
        setProjectMeta({ client: (meta.client || "").trim(), project: (meta.project || "").trim() });
        if (meta.client || meta.project) addLog("pass", `Identified: ${[meta.client, meta.project].filter(Boolean).join(" · ")}`);
      } catch (e) { if (e && e.name === "AbortError") throw e; /* else non-fatal: cover falls back to generic title */ }

      // Milestone context is now derived from the SINGLE FACT REGISTRY built in
      // buildDigest (text + figures) — no extra model call, and consistent with
      // every other table that reads the same registry.
      let programmeStructure = "";
      try {
        const reg = registryRef.current;
        const waves = reg && Array.isArray(reg.waves) ? reg.waves : [];
        const ms = reg && Array.isArray(reg.milestones) ? reg.milestones : [];
        if (waves.length || ms.length) {
          const lines = [];
          if (waves.length) {
            waves.forEach((w, i) => {
              lines.push(`- ${w.name || ("Wave " + (i + 1))}: go-live ${w.golive || "date per project plan"}${w.scope ? ` — scope: ${w.scope}` : ""}`);
              const wm = ms.filter((m) => (m.wave || "") === (w.name || ""));
              wm.forEach((m) => lines.push(`    ${m.gate || m.item}: ${m.date || "date per project plan"}${m.source ? ` — ${m.source}` : ""}`));
            });
            const orphan = ms.filter((m) => !m.wave);
            orphan.forEach((m) => lines.push(`- ${m.item}: ${m.date || "date per project plan"}${m.source ? ` — ${m.source}` : ""}`));
          } else {
            ms.forEach((m) => lines.push(`- ${m.item}${m.gate ? ` (${m.gate})` : ""}: ${m.date || "date per project plan"}${m.source ? ` — ${m.source}` : ""}`));
          }
          programmeStructure =
            "PROGRAMME DELIVERY STRUCTURE & TIMELINE (from the fact registry — text + figures) — schedule milestones for EVERY wave/item below using these EXACT dates; clause/figure-tag them as shown:\n" +
            lines.join("\n");
          const dated = ms.filter((m) => m.date).length;
          addLog("pass", `Milestone context from registry: ${waves.length} wave(s), ${ms.length} milestone(s) (${dated} dated).`);
        }
      } catch (e) { if (e && e.name === "AbortError") throw e; /* non-fatal: milestones fall back to a single ladder */ }

      if (stopped()) { addLog("plan", "Stopped."); return; }
      while (c < MAX_CYCLES && !stopped()) {
        // DETERMINISTIC selection — never trust the planner to decide we're done.
        // Selectable = not validated AND not yet at the attempt cap.
        const selectable = working
          .filter((e) => e.status !== VALIDATED && e.attempts < MAX_ATTEMPTS)
          .sort((a, b) => a.id - b.id);

        if (selectable.length === 0) {
          const allValid = working.every((e) => e.status === VALIDATED);
          addLog("done", allValid ? "Goal reached: all 11 components validated." : "No more components can be improved — finalizing with best drafts.");
          break;
        }

        c++; setCycle(c);
        const el = selectable[0];
        if (stopped()) { addLog("plan", "Stopped."); break; }   // catch a Stop pressed between cycles, before any API call
        const validated = working.filter((e) => e.status === VALIDATED).length;
        addLog("plan", `Cycle ${c}: ${validated}/11 validated. Working on ${el.id} (${el.name})${el.attempts > 0 ? ` — attempt ${el.attempts + 1}` : ""}.`);

        // ACT — draft (writer), feeding prior critique on a revision
        addLog("draft", `Drafting ${el.id}: ${el.name}${el.critique ? " (revision)" : ""}…`);
        const ctx = (el.id === 5 && programmeStructure) ? programmeStructure : "";
        const draft = await drafter(el, digest, el.critique, activeCodes, signal, ctx);
        if (stopped()) { addLog("plan", `Stopped mid-draft on ${el.id}.`); break; }
        // Enforce provenance tags in code: only active channels + SAP are allowed.
        const allowedSet = new Set([...activeCodes, "SAP"]);
        const fallback = activeCodes[0] || "SOW";
        const fixTag = (src) => (src && allowedSet.has(src) ? src : fallback);
        let bullets = (Array.isArray(draft.bullets) ? draft.bullets : []).map((b) => ({ ...b, source: fixTag(b.source) }));
        let tables = (Array.isArray(draft.tables) ? draft.tables : []).map((t) => ({ ...t, source: fixTag(t.source) }));

        // ── NO-INVENTION GATE (v3.8) — enforced, not asked ──
        // Every charter bullet/row must cite a real SOW source (a clause "§x", a page
        // "p12", a figure/exhibit ref, or an explicit honest-gap marker). Anything the
        // model produced WITHOUT a source is treated as invented and DROPPED. "Not
        // covered in SOW", "date per project plan", [FILL: …] and UNREADABLE are valid
        // (they are honest gap markers, not invented content).
        const hasSource = (text, source) => {
          const s = `${source || ""} ${text || ""}`;
          if (/\bSOW\b|§|\bp\.?\s?\d|\bpage\s?\d|exhibit|annex|clause|figure|fig\.?\s?\d|roadmap|schedule|table|section|\[audit\]/i.test(s)) return true;
          if (/not covered in sow|date per project plan|\[fill|unreadable|not (?:stated|specified|present) in sow|exclusions not explicitly/i.test(s)) return true; // honest gap markers
          return false;
        };
        let invented = 0;
        // A PURE invoice/billing period is not a milestone (the "Invoice Month" fabrication).
        // But a real delivery gate that happens to mention payment IS kept — so only strip
        // rows that have billing language AND no delivery-event language.
        const isPureBilling = (txt) => /\b(invoice|billing period|billing month|payment period)\b/i.test(String(txt || "")) &&
          !/(go-?live|milestone|gate|sign-?off|kick-?off|workshop|\bsit\b|\buat\b|test|cutover|deploy|hypercare|complet|review|readiness|training|prepare|realize|explore|commenc|term (?:start|end))/i.test(String(txt || ""));
        {
          const keptB = bullets.filter((b) => hasSource(b.text, b.source));
          invented += bullets.length - keptB.length;
          bullets = keptB;
          tables = tables.map((tb) => {
            const rows = (tb.rows || []).filter((r) => {
              const rowText = Array.isArray(r) ? r.join(" ") : String(r);
              if (!hasSource(rowText, tb.source)) { invented++; return false; }
              if (el.id === 5 && isPureBilling(rowText)) { invented++; return false; }   // pure billing row ≠ milestone
              return true;
            });
            return { ...tb, rows };
          }).filter((tb) => (tb.rows || []).length > 0 || /not covered|not present/i.test(tb.title || ""));
        }
        const fullBullets = bullets.slice();                       // uncapped — the annex holds everything
        const fullTables = tables.map((t) => ({ ...t, rows: (t.rows || []).slice() }));
        const capFlags = [];
        if (invented > 0) { capFlags.push(`${invented} unsourced item(s) removed (no SOW reference — not invented into the charter).`); addLog("reject", `${el.id} — dropped ${invented} unsourced item(s) (no-invention gate).`); }
        // CONTENT-SCALED (v3.8): NO display cap anywhere — every captured bullet and every
        // captured row renders in the charter in full. Nothing is truncated or pushed to
        // the annex for space. (The annex holds only supporting artifacts, never displaced
        // charter content.) maxBullets/maxRows remain only as generous safety ceilings that
        // are never reached in practice.
        // FULL-DRAFT (v3.7): keep everything the model returned, unchanged. We do NOT
        // mechanically split prose in code (that tears citations/abbreviations). Long
        // content is broken into clean bullets by the DRAFTER instead (see its prompt).
        working = working.map((e) => e.id === el.id ? { ...e, status: DRAFTED, bullets, tables, fullBullets, fullTables, flags: [...(draft.flags || []), ...capFlags] } : e);
        setState([...working]);

        // CRITIC — per-line-item checklist against the Output Spec
        if (stopped()) { addLog("plan", `Stopped before critique of ${el.id}.`); break; }   // don't start another call after Stop
        addLog("critic", `Critic checking ${el.id} against ${el.items.length} line items…`);
        const bulletText = bullets.map((b) => `- ${b.text} [${b.source}]`).join("\n");
        const tableText = tables.map((t) => `TABLE: ${t.title} [${t.source}]\n${(t.columns || []).join(" | ")}\n${(t.rows || []).map((r) => (r || []).join(" | ")).join("\n")}`).join("\n\n");
        const draftText = [bulletText, tableText].filter(Boolean).join("\n\n");
        const v = await critic(el, draftText, digest, signal);
        if (stopped()) { addLog("plan", `Stopped after drafting ${el.id}.`); break; }
        const attempts = el.attempts + 1;

        // Derive result from the checklist — code decides, not a model score.
        const checklist = Array.isArray(v.checklist) ? v.checklist : [];
        const covered = checklist.filter((c) => c.verdict === "covered").length;
        const partial = checklist.filter((c) => c.verdict === "partial").length;
        const missingItems = checklist.filter((c) => c.verdict === "missing");
        const total = checklist.length || el.items.length;
        const missing = [...missingItems, ...checklist.filter((c) => c.verdict === "partial")]
          .map((c) => `${c.item}${c.note ? ` (${c.note})` : ""}`);
        // VALIDATED only when every line item is covered. No missing AND no partial.
        const fullyCovered = checklist.length > 0 && missingItems.length === 0 && partial === 0;
        const coverageLabel = `${covered}/${total} covered${partial ? `, ${partial} partial` : ""}${missingItems.length ? `, ${missingItems.length} missing` : ""}`;

        if (fullyCovered) {
          addLog("pass", `${el.id} — ${coverageLabel} — VALIDATED.`);
          working = working.map((e) => e.id === el.id ? { ...e, status: VALIDATED, checklist, coverage: coverageLabel, critique: "", missing: [], attempts, needsReview: false } : e);
        } else if (attempts >= MAX_ATTEMPTS) {
          // Can't fully cover — accept best draft, flag for human review, MOVE ON.
          addLog("reject", `${el.id} — ${coverageLabel} after ${attempts} attempts — accepting best draft, flagged for review.`);
          working = working.map((e) => e.id === el.id ? { ...e, status: DRAFTED, checklist, coverage: coverageLabel, critique: missing.join("; "), missing, attempts, needsReview: true } : e);
        } else {
          addLog("reject", `${el.id} — ${coverageLabel} — revising: ${missing.slice(0, 3).join("; ")}`);
          working = working.map((e) => e.id === el.id ? { ...e, status: DRAFTED, checklist, coverage: coverageLabel, critique: missing.join("; "), missing, attempts, needsReview: false } : e);
        }
        setState([...working]);
      }

      // ── CROSS-TABLE CONSISTENCY (v3.2) — reconcile against the fact registry ──
      // No table may show "date per project plan" for an item the registry has a
      // date for; and the same item must carry the same date everywhere.
      try {
        const reg = registryRef.current;
        const regMs = reg && Array.isArray(reg.milestones) ? reg.milestones : [];
        const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
        const dateFor = (cellText) => {
          const key = norm(cellText);
          if (!key) return null;
          const hit = regMs.find((m) => m.date && (norm(m.item) === key || (norm(m.item) && key.includes(norm(m.item))) || (norm(m.gate) && key.includes(norm(m.gate)))));
          return hit ? hit.date : null;
        };
        let filled = 0;
        const conflicts = [];
        working = working.map((e) => {
          if (!Array.isArray(e.tables) || !e.tables.length) return e;
          const tables = e.tables.map((tb) => {
            const cols = tb.columns || [];
            const dateCol = cols.findIndex((c) => /date/i.test(c));
            if (dateCol < 0 || !Array.isArray(tb.rows)) return tb;
            const itemCol = cols.findIndex((c, i) => i !== dateCol && !/release|window|check|flag|status/i.test(c));
            const ic = itemCol < 0 ? 0 : itemCol;
            const rows = tb.rows.map((r) => {
              if (!Array.isArray(r) || r.length <= dateCol) return r;
              const item = r[ic];
              const cur = String(r[dateCol] || "");
              const regDate = dateFor(item);
              if (regDate) {
                if (!cur || /per project plan|tbc|tbd|n\/a|^—?$/i.test(cur.trim())) {
                  const nr = r.slice(); nr[dateCol] = regDate; filled++; return nr;   // fill from registry
                }
                if (norm(cur) !== norm(regDate)) conflicts.push(`${e.id}:"${item}" ${cur} vs registry ${regDate}`);
              }
              return r;
            });
            return { ...tb, rows };
          });
          return { ...e, tables };
        });
        if (filled) addLog("pass", `Consistency: filled ${filled} "date per project plan" cell(s) from the registry.`);
        if (conflicts.length) { setConsistency(conflicts); addLog("reject", `Consistency: ${conflicts.length} date conflict(s) flagged for review.`); }
        else setConsistency(null);
        setState([...working]);
      } catch (e) { if (e && e.name === "AbortError") throw e; /* non-fatal */ }

      // ── PM REVIEW PASS (PM_Skill.md) — flag-only notes + pre-ship rubric ──
      // Runs once over the assembled charter. Emits observations (annex only,
      // never charter content) and a 0–2 rubric scorecard. Purely advisory.
      if (!stopped()) {
        try {
          addLog("plan", "PM review — red-flag scan & pre-ship rubric…");
          const charterText = working.map((e) => {
            const bl = (e.fullBullets || e.bullets || []).map((b) => `• ${b.text}`).join("\n");
            const tb = (e.fullTables || e.tables || []).map((t) => `[${t.title}] ${(t.columns || []).join(" | ")}\n` + (t.rows || []).map((r) => (r || []).join(" | ")).join("\n")).join("\n");
            return `## ${e.id}. ${e.name}\n${bl}\n${tb}`;
          }).join("\n\n");
          const rubricList = PM_RUBRIC.map((r, i) => `${i + 1}. ${r}`).join("\n");
          const sys = `${PM_PERSONA}\nYou are doing a FINAL PM review of an assembled SAP S/4HANA charter. Two jobs, both ADVISORY — you never rewrite the charter and never add content.\n` +
            `JOB 1 — RED-FLAG SCAN: over the captured facts only, raise observations from this library where the evidence supports them. Each note MUST cite the clause/figure it derives from. Never invent a flag with no basis. Financial commentary is prohibited (even 'fees back-loaded').\nRED-FLAG LIBRARY:\n${RED_FLAG_LIBRARY.join("\n")}\n` +
            `JOB 2 — RUBRIC: score each line 0, 1 or 2 (0 = fails, 2 = fully met).\nRUBRIC:\n${rubricList}\n` +
            `Return ONLY JSON: {"notes":[{"category":"<Schedule|Scope|Governance|Data|Multi-wave>","flag":"<observation>","ref":"<SOW clause/figure>","why":"<one sentence>"}],"rubric":[{"n":1,"score":0|1|2,"note":"<≤12 words if score<2>"}]}`;
          const raw = await apiRaw([{ type: "text", text: `CHARTER:\n${charterText}\n\nREGISTRY & DIGEST (evidence):\n${digest.slice(0, 6000)}` }], sys, 1800, signal);
          const rev = extractJSON(raw);
          if (rev && typeof rev === "object") {
            setPmReview({ notes: Array.isArray(rev.notes) ? rev.notes : [], rubric: Array.isArray(rev.rubric) ? rev.rubric : [] });
            const zeros = (rev.rubric || []).filter((r) => r.score === 0).length;
            const total = (rev.rubric || []).reduce((a, r) => a + (Number(r.score) || 0), 0);
            addLog(zeros ? "reject" : "pass", `PM review: ${(rev.notes || []).length} flag(s); rubric ${total}/18${zeros ? ` · ${zeros} line(s) at 0 — review` : ""}.`);
          }
        } catch (e) { if (e && e.name === "AbortError") throw e; /* non-fatal: review is advisory */ }
      }

      setDone(working.every((e) => e.status === VALIDATED));
      // ── Save artifacts to backend infrastructure layer (non-fatal) ──────
      try {
        const saved = await saveArtifacts({
          project_meta: projectMeta,
          components:   working,
          registry:     registryRef.current,
          coverage,
          pm_review:    pmReview,
          consistency,
          elapsed_ms:   startRef.current ? Date.now() - startRef.current : 0,
          tokens:       { in: _tok.in, out: _tok.out, cost_usd: _costUSD() },
        });
        if (saved && saved.run_id) {
          setRunId(saved.run_id);
          addLog("pass", `Run saved \u2014 ID: ${saved.run_id} \u00b7 handoff ready for L4 Plan Agent`);
        }
      } catch (_) { /* backend infrastructure is optional */ }
      if (startRef.current && !stopRef.current) recordRunTime(Date.now() - startRef.current);
        setRunId(null);  // reset on new run   // log completed-run duration
    } catch (e) {
      if (e && e.name === "AbortError") { addLog("plan", "Stopped — current model call cancelled."); }
      else { setError(e.message); addLog("reject", `Error: [${e.name || "Error"}] ${e.message}`); }
    } finally {
      setRunning(false);
      setStopping(false);   // run has fully halted
      abortRef.current = null;
      if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
      // Freeze the timer on the exact end moment.
      if (startRef.current) setElapsedMs(Date.now() - startRef.current);
    }
  }
  async function saveArtifacts(payload) {
    try {
      const resp = await fetch(`${BACKEND_URL}/api/artifacts`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!resp.ok) return null;
      return await resp.json();
    } catch { return null; }
  }

  const stop = () => {
    if (stopRef.current) return;   // already stopping — ignore repeat clicks (was logging 5×)
    stopRef.current = true;
    setStopping(true);   // instant UI feedback while the in-flight request unwinds
    if (abortRef.current) abortRef.current.abort();   // cancel the in-flight fetch AND any backoff sleep immediately
    if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
    if (startRef.current) setElapsedMs(Date.now() - startRef.current);
    addLog("plan", "Stopping — cancelling the current step…");
  };

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  // mm:ss.d elapsed formatter for the run timer.
  function fmtTime(ms) {
    if (!ms) return "0.0s";
    const totalS = ms / 1000;
    if (totalS < 60) return `${totalS.toFixed(1)}s`;
    const m = Math.floor(totalS / 60);
    const s = totalS - m * 60;
    return `${m}m ${s.toFixed(0)}s`;
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // Generate the SAP PM_15 "Project Charter (Mandatory)" as Word (.doc),
  // charter body in place of the J4C placeholder, signature blocks intact.
  function downloadPM15() {
    const today = new Date().toISOString().slice(0, 10);
    const cellHdr = "background:#F2B705;color:#1A1A2E;font-weight:bold;padding:6px 10px;border:1px solid #C9C9C9;font-size:12px;";
    const cell = "padding:6px 10px;border:1px solid #C9C9C9;font-size:11.5px;vertical-align:top;";

    const body = state.map((e) => {
      const bl = e.bullets || [];
      const tbls = e.tables || [];
      const hasAny = bl.length || tbls.length;
      const items = bl.length
        ? `<ul style="margin:4px 0 0;padding-left:20px;">${bl.map((b) => `<li style="font-size:12px;color:#1A1A2E;margin:2px 0;line-height:1.45;">${esc(b.text).replace(/\n/g, "<br>")} <span style="font-size:9px;color:#0A3D7A;background:#E8F1FC;padding:1px 5px;border-radius:3px;">${esc(b.source || "?")}</span></li>`).join("")}</ul>`
        : (tbls.length ? "" : `<div style="font-size:12px;color:#888;font-style:italic;margin:3px 0;">Not drafted.</div>`);
      const escML = (v) => esc(v).replace(/\n/g, "<br>");
      const tblHtml = tbls.map((t) => {
        const cols = (t.columns || []).map((cH) => `<td style="background:#EEE9F5;color:#460073;font-weight:bold;padding:4px 8px;border:1px solid #C9C9C9;font-size:11px;">${esc(cH)}</td>`).join("");
        const rows = (t.rows || []).map((r) => `<tr>${(r || []).map((cellVal) => `<td style="padding:4px 8px;border:1px solid #C9C9C9;font-size:11px;vertical-align:top;">${escML(cellVal)}</td>`).join("")}</tr>`).join("");
        return `<div style="margin:6px 0 2px;font-size:11.5px;font-weight:bold;color:#1A1A2E;">${esc(t.title)} <span style="font-size:9px;color:#0A3D7A;background:#E8F1FC;padding:1px 5px;border-radius:3px;font-weight:normal;">${esc(t.source || "?")}</span></div>
          <table style="width:100%;border-collapse:collapse;margin:2px 0 8px;"><tr>${cols}</tr>${rows}</table>`;
      }).join("");
      const checkHtml = (e.checklist && e.checklist.length) ? `<div style="margin-top:4px;font-size:10px;">` + e.checklist.map((c) => {
        const col = c.verdict === "covered" ? "#1E7A34" : c.verdict === "partial" ? "#B4690E" : "#B42318";
        const mk = c.verdict === "covered" ? "&#10003;" : c.verdict === "partial" ? "~" : "&#10007;";
        return `<div style="color:#333;"><span style="color:${col};font-weight:bold;">${mk}</span> ${esc(c.item)}${c.note && c.verdict !== "covered" ? ` <span style="color:${col};">— ${esc(c.note)}</span>` : ""}</div>`;
      }).join("") + `</div>` : "";
      const notDrafted = !hasAny ? `<div style="font-size:10.5px;color:#B4690E;margin-top:3px;">Not yet drafted.</div>` : "";
      return `<div style="margin:0 0 13px;">
        <div style="font-size:13px;font-weight:bold;color:#460073;">${e.id}. ${esc(e.name)}</div>
        ${items}${tblHtml}${checkHtml}${notDrafted}
      </div>`;
    }).join("");

    const sigBlock = (title, role) => `
      <div style="margin:26px 0 4px;border-bottom:1px solid #333;width:75%;">&nbsp;</div>
      <table style="width:75%;border:0;"><tr>
        <td style="border:0;font-size:11px;padding:0;">${esc(title)}</td>
        <td style="border:0;font-size:11px;padding:0;text-align:center;">Date</td>
        <td style="border:0;font-size:11px;padding:0;text-align:right;">Signature</td>
      </tr></table>
      <div style="font-size:11px;color:#333;">${esc(role)}</div>`;

    // Cover-page names extracted from inputs (fall back gracefully if absent).
    const clientName = (projectMeta.client || "").trim();
    const projectName = (projectMeta.project || "").trim();
    // Cover shows honest [FILL:] tokens when a name is scrubbed/absent — consistent
    // with the signatory blocks below (never a generic or invented title).
    const projectLine = projectName ? esc(projectName) : "[FILL: Project Name]";
    const clientLine = clientName ? esc(clientName) : "[FILL: Client Name]";
    const pageBreak = `<div style="page-break-before:always;"></div>`;

    // v3.8 — signatories come from the fact registry (sponsor/signatory entities), or
    // an honest [FILL:] token when scrubbed/absent. NEVER a hardcoded sample name.
    const sigReg = registryRef.current || {};
    const findEntity = (re) => (Array.isArray(sigReg.entities) ? sigReg.entities : []).find((e) => e && re.test(`${e.role || ""} ${e.name || ""}`));
    const sponsorEnt = findEntity(/sponsor|cfo|executive sponsor/i);
    const siEnt = findEntity(/delivery|managing director|partner|si lead|accenture/i);
    const custSponsorName = (sponsorEnt && sponsorEnt.name) ? esc(sponsorEnt.name) : "[FILL: Customer Project Sponsor Name]";
    const custSponsorRole = (sponsorEnt && sponsorEnt.role) ? esc(sponsorEnt.role) : "[FILL: Sponsor Title] — Customer Project Sponsor";
    const siExecName = (siEnt && siEnt.name) ? esc(siEnt.name) : "[FILL: SI Delivery Executive Name]";
    const siExecRole = (siEnt && siEnt.role) ? esc(siEnt.role) : "[FILL: SI Title] — SAP Delivery Executive";

    // Index / table of contents — one line per component.
    const indexRows = state.map((e) => `
      <tr>
        <td style="padding:5px 8px;border-bottom:1px solid #E4E4EC;font-size:12.5px;color:#460073;font-weight:bold;width:36px;">${e.id}</td>
        <td style="padding:5px 8px;border-bottom:1px solid #E4E4EC;font-size:12.5px;color:#1A1A2E;">${esc(e.name)}</td>
        <td style="padding:5px 8px;border-bottom:1px solid #E4E4EC;font-size:11px;color:#6B6B6B;text-align:right;">${e.status === "validated" ? "Validated" : (e.needsReview ? "Needs review" : "Draft")}</td>
      </tr>`).join("");

    const coverPage = `
