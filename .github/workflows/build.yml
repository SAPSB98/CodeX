name: Build CodeX .exe

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build renderer
        run: npm run build:renderer

      - name: Build exe
        run: npm run build

      - name: Upload exe
        uses: actions/upload-artifact@v3
        with:
          name: CodeX-Windows
          path: release/*.exe